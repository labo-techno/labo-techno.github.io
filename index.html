es déchets (biodéchets, emballages).", "anim": ""}]}, "video": ""}, {"id": "TC-COMM", "titre": "Vente, communication et environnement", "court": "Vente", "poste": "Magasin", "domaine": "Communication et environnement (tronc commun)", "bloc": "Tronc commun", "prerequis": "", "badge": "Ambassadeur du magasin", "competences": [{"id": "CM-1", "libelle": "Transmettre un argumentaire produit au personnel de vente", "pratique": false}, {"id": "CM-2", "libelle": "Présenter et étiqueter les produits", "pratique": false}, {"id": "CM-3", "libelle": "Utiliser un langage professionnel adapté", "pratique": false}, {"id": "CM-4", "libelle": "Trier les déchets et appliquer la démarche environnementale", "pratique": false}, {"id": "CM-5", "libelle": "Identifier les risques pour sa santé au travail", "pratique": false}], "fiche": {"duree": "7 min", "essentiel": ["Un bon argumentaire relie une caractéristique du produit à un avantage pour le client.", "Chaque produit en vente : nom, prix, allergènes disponibles pour le client.", "Langage professionnel : vouvoiement, mots du métier expliqués simplement.", "Tri à la source des biodéchets (restes alimentaires) : obligatoire pour les professionnels.", "Le Document unique liste les risques du poste : farine, charges, brûlures, coupures, chutes."], "sections": [{"t": "Transmettre un argumentaire au personnel de vente", "md": "Le vendeur doit pouvoir répondre au client. Le fabricant lui transmet les informations utiles, en quelques phrases.\n\nMéthode simple : **caractéristique → avantage → preuve**.\n\nCaractéristique | Avantage pour le client | Exemple de phrase\nPain au levain naturel | Goût plus riche, se garde plus longtemps | « Il est fait au levain, il se garde 3 à 4 jours. »\nFarine de meule T80 | Plus de fibres, goût de céréale | « Farine bise : plus de goût et plus de fibres. »\nJambon cuit sur place | Fraîcheur, savoir-faire | « Nous le cuisons ici, dans nos moules. »\n\nToujours transmettre aussi : les **allergènes**, la **conservation** (comment et combien de temps) et les idées d'utilisation.", "anim": ""}, {"t": "Présenter et étiqueter les produits", "md": "- Vitrine propre, produits alignés, les plus beaux devant.\n- Rotation : les produits les plus anciens sont vendus en premier (PEPS), en respectant les dates.\n- Chaque produit porte son **nom** et son **prix** (à la pièce ou au kilo).\n- L'**information sur les allergènes** doit être disponible pour le client (affichage, classeur, réponse du vendeur).\n- Les produits sensibles (crème, charcuterie, traiteur) restent en vitrine réfrigérée.\n\nOn signale au responsable un produit non conforme : forme, cuisson, poids ou aspect.", "anim": ""}, {"t": "Communiquer dans l'équipe", "md": "- Avec la hiérarchie : rendre compte d'un problème (livraison non conforme, panne, produit raté) tout de suite, avec des faits précis.\n- Avec les collègues : consignes claires, vocabulaire du métier.\n- Avec les clients : vouvoiement, politesse, phrases simples. On explique un mot technique au lieu de l'utiliser seul.\n\nExemple : « La livraison de farine est arrivée avec un sac déchiré et humide. Je l'ai mis de côté et noté sur le bon de livraison. »", "anim": ""}, {"t": "Déchets et démarche environnementale", "md": "Déchet | Où va-t-il ?\nRestes alimentaires, invendus non donnés, épluchures | Biodéchets (tri à la source obligatoire)\nCartons, papier | Recyclage\nHuiles et graisses usagées | Collecte spécifique (jamais dans l'évier)\nEmballages plastiques souillés | Selon les consignes de la commune\n\nRéduire les déchets et l'énergie :\n- produire au plus près des ventes, réutiliser quand c'est sûr (pain rassis en chapelure, pudding) ;\n- donner les invendus à une association quand c'est possible ;\n- fermer les portes des chambres froides, éteindre les fours inutiles, charger le four au maximum.", "anim": ""}, {"t": "Santé et sécurité au travail", "md": "Le **Document unique d'évaluation des risques** (DUERP) liste les risques de chaque poste et les mesures de prévention. On le respecte.\n\nRisque | Prévention\nPoussières de farine (asthme, rhinite du boulanger) | Verser la farine doucement, aspiration, pas de balayage à sec\nPort de charges (sacs de 25 kg), gestes répétés | Chariot, gestes et postures, se faire aider\nBrûlures (four, plaques, sucre cuit) | Gants anti-chaleur, manches longues\nCoupures (couteaux, trancheuse, hachoir) | Gants de maille, protège-lame, pousse-viande\nChutes (sol mouillé ou fariné) | Chaussures de sécurité antidérapantes, nettoyer tout de suite", "anim": ""}]}, "video": ""}, {"id": "BO-MP", "titre": "Les matières premières du boulanger", "court": "Matières premières", "poste": "Silo", "domaine": "Matières premières", "bloc": "BC01 / BC02", "prerequis": "", "badge": "Meunier", "competences": [{"id": "BM-1", "libelle": "Lire un type de farine et choisir la bonne farine", "pratique": false}, {"id": "BM-2", "libelle": "Expliquer la formation du gluten", "pratique": false}, {"id": "BM-3", "libelle": "Citer le rôle de l'eau et du sel", "pratique": false}, {"id": "BM-4", "libelle": "Distinguer levure, levain et pré-fermentations", "pratique": false}, {"id": "BM-5", "libelle": "Contrôler la réception et le stockage des farines", "pratique": false}], "fiche": {"duree": "8 min", "essentiel": ["Le type de farine (T55, T65…) indique sa teneur en minéraux : plus il est élevé, plus la farine est bise.", "Gluten = protéines de la farine + eau + travail : il retient le gaz.", "Sel : goût, force de la pâte, régule la fermentation (environ 18 g par kg de farine).", "Levure : fermentation rapide. Levain : levures sauvages + bactéries lactiques, goût acidulé.", "Farines stockées au sec, sur palettes, à l'abri des nuisibles, en PEPS."], "sections": [{"t": "Les farines", "md": "Le **type** d'une farine correspond à sa teneur en matières minérales (les cendres). Plus le type est élevé, plus il reste d'enveloppe du grain : farine plus bise, plus riche en fibres et en goût.\n\nType | Nom courant | Utilisation\nT45 | Farine blanche fine | Viennoiseries, brioches, pâtisserie\nT55 | Farine blanche | Pain courant, baguette\nT65 | Farine blanche à bise | Pain de tradition, pain de campagne\nT80 | Farine bise | Pains spéciaux, pain bis\nT110 | Farine semi-complète | Pain semi-complet\nT150 | Farine complète (intégrale) | Pain complet\n\nLa **force boulangère** d'une farine (mesurée à l'alvéographe) indique sa capacité à retenir le gaz. Une farine de force sert aux viennoiseries et aux pousses longues.\n\nAutres céréales : seigle (pain de seigle, peu de gluten), épeautre, sarrasin (sans gluten, ce n'est pas un blé).", "anim": ""}, {"t": "Le gluten", "md": "La farine de blé contient deux protéines : la **gliadine** (qui donne l'extensibilité) et la **gluténine** (qui donne l'élasticité). Avec l'eau et le pétrissage, elles forment le **gluten** : un réseau souple et élastique.\n\nCe réseau retient le gaz carbonique produit par la fermentation : la pâte gonfle et la mie forme des alvéoles.\n\nLe seigle forme peu de gluten : les pains de seigle sont plus denses et se travaillent avec une pâte plus hydratée.", "anim": ""}, {"t": "L'eau et le sel", "md": "**Eau :** hydrate la farine, permet au gluten de se former et à la levure de travailler. On parle de **taux d'hydratation** (poids d'eau ÷ poids de farine). Pain courant : environ 60 à 70 %. Sa température sert à régler celle de la pâte.\n\n**Sel :** environ 18 g par kg de farine (repère de la profession pour limiter le sel).\n- donne le goût ;\n- resserre le gluten : pâte plus tenace ;\n- régule la fermentation (trop de sel la freine) ;\n- favorise la coloration et la conservation de la croûte.\n\nLe sel ne doit pas être versé directement sur la levure.", "anim": ""}, {"t": "Levure, levain, pré-fermentations", "md": "Agent | Composition | Effet\nLevure de boulanger | Champignons microscopiques sélectionnés | Fermentation rapide et régulière\nLevain naturel | Farine + eau, levures sauvages et bactéries lactiques, entretenu par « rafraîchis » | Goût acidulé, mie plus dense, meilleure conservation\nPoolish | Farine et eau à poids égal + un peu de levure, fermentation de plusieurs heures | Goût, extensibilité, croûte fine\nPâte fermentée | Morceau de pâte de la veille | Goût, force\n\nLevain « chef » : la base que l'on garde. Le **rafraîchi** : on lui ajoute farine et eau pour le nourrir et le multiplier.", "anim": ""}, {"t": "Réception et stockage", "md": "À la livraison : sacs intacts et secs, pas de trace de nuisibles, dates et numéros de lot, quantités conformes au bon. Toute non-conformité est notée et signalée.\n\nStockage : local sec et ventilé, sacs sur palettes (jamais au sol), loin des murs, à l'abri des insectes et des rongeurs, en PEPS. La levure fraîche se garde au froid positif.\n\nAllergènes : gluten (blé, seigle, épeautre…). Les graines (sésame), la moutarde ou le lait peuvent entrer dans les pains spéciaux.", "anim": ""}]}, "video": ""}, {"id": "BO-PANIF", "titre": "La panification pas à pas", "court": "Panification", "poste": "Pétrin", "domaine": "Procédés et techniques", "bloc": "BC02", "prerequis": "TC-HS", "badge": "Main de boulanger", "competences": [{"id": "BP-1", "libelle": "Ordonner les étapes de la panification", "pratique": false}, {"id": "BP-2", "libelle": "Expliquer le pétrissage et la fermentation", "pratique": false}, {"id": "BP-3", "libelle": "Expliquer le façonnage, l'apprêt et le lamage", "pratique": false}, {"id": "BP-4", "libelle": "Expliquer la cuisson, la buée et le ressuage", "pratique": false}, {"id": "BP-5", "libelle": "Diagnostiquer un défaut de pain", "pratique": false}, {"id": "BP-6", "libelle": "Réaliser des baguettes régulières", "pratique": true}], "fiche": {"duree": "10 min", "essentiel": ["Pétrissage → pointage → division → boulage → détente → façonnage → apprêt → lamage → cuisson → ressuage.", "Le pétrissage forme le gluten ; le frasage est le premier mélange.", "Pointage et apprêt : deux temps de fermentation.", "La buée à l'enfournement permet au pain de se développer et à la grigne de s'ouvrir.", "Ressuage : le pain refroidit et perd de la vapeur sur grille."], "sections": [{"t": "Les étapes de la panification", "md": "1. **Pesée** des ingrédients et calcul de la température de l'eau.\n2. **Pétrissage :** frasage (mélange) puis pétrissage (étirage) jusqu'à une pâte lisse.\n3. **Pointage :** première fermentation, en masse.\n4. **Division :** peser les pâtons (à la main ou à la diviseuse).\n5. **Boulage ou préfaçonnage :** donner une première forme.\n6. **Détente :** repos pour que la pâte se relâche.\n7. **Façonnage :** forme finale (baguette, boule, bâtard…).\n8. **Apprêt :** deuxième fermentation des pièces façonnées, souvent sur couche (toile de lin).\n9. **Lamage (scarification) :** inciser la pâte à la lame pour former la grigne.\n10. **Enfournement avec buée, cuisson.**\n11. **Ressuage :** refroidissement sur grille.", "anim": ""}, {"t": "Pétrissage et fermentation", "md": "**Frasage :** mélange lent des ingrédients. **Pétrissage :** travail plus rapide qui forme le gluten. On contrôle la pâte : lisse, élastique, qui se décolle de la cuve.\n\nMéthode | Principe | Résultat\nPétrissage lent (1re vitesse) | Peu d'oxygène incorporé | Mie crème, goût, alvéoles irrégulières\nPétrissage amélioré | Un peu de 2e vitesse | Compromis\nPétrissage intensifié | Longtemps en 2e vitesse | Gros volume, mie blanche, moins de goût\n\n**Autolyse :** farine + eau laissées au repos avant d'ajouter levure et sel. La pâte devient plus extensible.\n\n**Fermentation :** la levure transforme les sucres en gaz carbonique et en alcool. Pendant le pointage, la pâte prend de la force et du goût. Pendant l'apprêt, elle prend son volume. On peut **rabattre** la pâte pendant le pointage pour lui redonner de la force.\n\nTempérature de pâte visée en fin de pétrissage : souvent autour de 23 à 25 °C, selon la fiche technique.", "anim": ""}, {"t": "Façonnage, apprêt, lamage", "md": "Le façonnage doit **serrer** la pâte sans la déchirer : la surface tendue retient le gaz et donne un pain bien tenu.\n\nL'**apprêt** se fait à l'abri des courants d'air. Pièces sur couche farinée, plis de toile entre les baguettes.\n\nContrôle de l'apprêt : une légère pression du doigt laisse une marque qui remonte doucement.\n- Remonte vite : pas assez poussé.\n- Ne remonte pas : trop poussé, le pain risque de s'affaisser.\n\n**Lamage :** coups de lame nets, presque parallèles à la pâte, qui se chevauchent légèrement. Ils permettent au pain de se développer et forment la **grigne**.", "anim": ""}, {"t": "Cuisson, buée, ressuage", "md": "On enfourne dans un four bien chaud (souvent 230 à 250 °C pour la baguette, selon le four), **avec buée** :\n- la vapeur garde la surface souple quelques minutes : le pain se développe et la grigne s'ouvre ;\n- la croûte devient fine et brillante.\n\nOn ouvre ensuite le **oura** (sortie de vapeur) pour sécher le four et obtenir une croûte croustillante.\n\nPendant la cuisson : l'amidon cuit, les protéines coagulent, les sucres colorent la croûte (réaction de Maillard, caramélisation). Le pain perd de l'eau : c'est la **perte au four**.\n\n**Ressuage :** le pain refroidit sur grille et rejette encore de la vapeur. Sans grille, la croûte ramollit. Un pain se tranche une fois ressuyé.", "anim": ""}, {"t": "Défauts : causes et remèdes", "md": "Défaut | Causes probables | Remède\nPain plat, qui s'étale | Pâte trop hydratée, apprêt trop long, façonnage pas assez serré | Ajuster l'eau, surveiller l'apprêt, serrer le façonnage\nGrigne qui ne s'ouvre pas | Apprêt trop poussé, pas de buée, lame mal tenue | Enfourner plus tôt, buée, lame presque à plat\nCroûte pâle | Four pas assez chaud, fermentation trop longue (sucres consommés), cuisson trop courte | Régler le four, maîtriser la fermentation\nMie collante | Pain pas assez cuit, tranché trop tôt | Cuire davantage, laisser ressuer\nCroûte qui ramollit vite | Pas de ressuage sur grille, pas assez cuit | Ressuer sur grille, prolonger la cuisson\nMie serrée, petit volume | Pétrissage insuffisant, apprêt trop court, levure en contact avec le sel | Pétrir jusqu'à une pâte lisse, respecter l'apprêt", "anim": ""}, {"t": "Le matériel", "md": "Matériel | Usage\nPétrin (à spirale, à axe oblique) | Frasage et pétrissage\nDiviseuse | Diviser la pâte en pâtons de poids égal\nFaçonneuse | Allonger les baguettes\nCouche (toile de lin) | Apprêt des baguettes\nChambre de fermentation contrôlée | Bloquer, retarder ou lancer la fermentation à l'heure voulue\nFour à sole, four ventilé | Cuisson ; buée pour le développement\nLame (grignette) | Lamage", "anim": ""}]}, "video": ""}, {"id": "BO-PAINS", "titre": "Pains de tradition, pains spéciaux, levain", "court": "Pains", "poste": "Four", "domaine": "Procédés et techniques", "bloc": "BC02", "prerequis": "BO-MP", "badge": "Gardien de la tradition", "competences": [{"id": "BS-1", "libelle": "Définir le pain de tradition française", "pratique": false}, {"id": "BS-2", "libelle": "Expliquer la fermentation au levain", "pratique": false}, {"id": "BS-3", "libelle": "Reconnaître les pains spéciaux et leurs farines", "pratique": false}, {"id": "BS-4", "libelle": "Utiliser la pousse contrôlée", "pratique": false}, {"id": "BS-5", "libelle": "Réaliser un pain au levain", "pratique": true}], "fiche": {"duree": "8 min", "essentiel": ["Pain de tradition française : farine de blé, eau, sel, levure et/ou levain ; ni additif, ni surgélation.", "Levain : fermentation lente par des levures sauvages et des bactéries lactiques.", "Les pains spéciaux utilisent d'autres farines (seigle, complète, épeautre) ou des ajouts (graines, fruits secs).", "La pousse contrôlée permet de bloquer la fermentation au froid et de cuire à l'heure voulue.", "Un pain au levain se garde plus longtemps."], "sections": [{"t": "Le pain de tradition française", "md": "Défini par un décret de 1993, le pain de tradition française :\n- est fait **uniquement** de farine de blé panifiable, d'eau potable, de sel, et de levure et/ou de levain ;\n- ne contient **aucun additif** (quelques auxiliaires naturels très limités sont tolérés par le texte) ;\n- n'a subi **aucune surgélation** pendant sa fabrication.\n\nOn le fabrique souvent avec une farine T65, une pousse lente (pointage long, parfois au froid) qui développe le goût, et une mie crème aux alvéoles irrégulières.\n\n[À VÉRIFIER dans le décret n° 93-1074 : liste exacte et doses des auxiliaires tolérés.]", "anim": ""}, {"t": "Le levain", "md": "Le **levain naturel** est une culture de farine et d'eau où vivent des levures sauvages et des bactéries lactiques.\n\n- Les levures produisent le gaz : le pain lève (plus lentement qu'avec la levure).\n- Les bactéries produisent des acides : goût acidulé, mie plus dense, croûte épaisse, meilleure conservation.\n\nOn entretient le **levain chef** par des **rafraîchis** réguliers (ajout de farine et d'eau). Un levain dur (peu d'eau) est plus acide ; un levain liquide est plus doux.\n\nUn pain « au levain » est fait sans levure ajoutée (ou presque) : vérifier la définition retenue par l'entreprise.", "anim": ""}, {"t": "Les pains spéciaux", "md": "Pain | Particularité\nPain de campagne | Farine de blé + un peu de seigle, souvent au levain\nPain complet | Farine complète (T150), plus de fibres\nPain de seigle | Au moins une part importante de farine de seigle, mie dense\nPain aux céréales | Graines (lin, tournesol, sésame…) ; trempage des graines conseillé\nPain d'épeautre | Farine d'épeautre, gluten plus fragile : pétrissage doux\nFougasse, ciabatta | Pâtes très hydratées, huile d'olive\nPain de mie | Pâte enrichie (lait, beurre, sucre), cuite en moule\n\nPour les graines et les farines spéciales, l'information **allergènes** est essentielle (sésame, moutarde, lait, fruits à coque).", "anim": ""}, {"t": "La pousse contrôlée", "md": "La **chambre de fermentation contrôlée** règle la température et l'humidité selon un programme :\n1. **Blocage** au froid : la fermentation s'arrête presque.\n2. **Remontée** progressive en température.\n3. **Pousse** : apprêt à la bonne température.\n\nAvantages : cuire à l'heure voulue (pain chaud à l'ouverture), mieux organiser le travail, développer le goût par une fermentation lente.\n\nLe **pointage retardé** au froid (pâte en bacs, une nuit) suit le même principe.", "anim": ""}]}, "video": ""}, {"id": "BO-CALC", "titre": "Calculs du boulanger", "court": "Calculs", "poste": "Bureau", "domaine": "Calculs professionnels", "bloc": "BC02", "prerequis": "", "badge": "Balance d'or", "competences": [{"id": "BC-1", "libelle": "Calculer la température de l'eau de coulage", "pratique": false}, {"id": "BC-2", "libelle": "Utiliser le pourcentage boulanger", "pratique": false}, {"id": "BC-3", "libelle": "Calculer division, rendement et perte au four", "pratique": false}, {"id": "BC-4", "libelle": "Adapter une recette à une production", "pratique": false}], "fiche": {"duree": "8 min", "essentiel": ["Température de l'eau = température de base − (température de la farine + température du fournil).", "Pourcentage boulanger : chaque ingrédient en % du poids de farine (farine = 100 %).", "Nombre de pâtons = poids de pâte ÷ poids d'un pâton.", "Perte au four (%) = (poids cru − poids cuit) ÷ poids cru × 100.", "Coefficient = quantité voulue ÷ quantité de la recette."], "sections": [{"t": "La température de l'eau de coulage", "md": "Pour obtenir la bonne température de pâte, on calcule la température de l'eau avec la **température de base** (TB) donnée par la fiche technique (elle dépend du pétrin et de la méthode).\n\nMéthode à trois facteurs :\n**T eau = TB − T farine − T fournil**\n\nExemple : TB = 60, farine à 20 °C, fournil à 22 °C → eau = 60 − 20 − 22 = **18 °C**.\n\nAvec un levain ou une pâte fermentée, on ajoute un 4e facteur (sa température) et la TB est plus élevée. Si l'eau calculée est très froide, on utilise de l'eau glacée ou de la glace pilée.", "anim": ""}, {"t": "Le pourcentage boulanger", "md": "Chaque ingrédient s'exprime en pourcentage du **poids de farine** (farine = 100 %).\n\nIngrédient | % boulanger | Pour 10 kg de farine\nFarine | 100 % | 10 kg\nEau | 65 % | 6,5 kg (6,5 L)\nSel | 1,8 % | 180 g\nLevure | 1,5 % | 150 g\n\nAvantage : on adapte facilement à n'importe quelle quantité de farine. Taux d'hydratation = eau ÷ farine × 100.", "anim": ""}, {"t": "Division, rendement, perte au four", "md": "**Poids total de pâte** = somme de tous les ingrédients.\n\n**Nombre de pâtons** = poids de pâte ÷ poids d'un pâton (on garde le nombre entier).\n\n**Perte au four** = poids cru − poids cuit. En % : (cru − cuit) ÷ cru × 100.\nExemple : pâton de 350 g, pain cuit de 280 g → perte de 70 g, soit 20 %.\n\n**Poids de pâte pour un pain cuit voulu** = poids cuit ÷ (1 − perte en décimal).\nExemple : pour un pain de 400 g cuit avec 20 % de perte : 400 ÷ 0,8 = 500 g de pâte.", "anim": ""}, {"t": "Adapter une recette", "md": "**Coefficient** = quantité voulue ÷ quantité de la recette. On multiplie chaque ingrédient par ce coefficient.\n\nExemple : recette pour 5 kg de farine ; on veut 8 kg → coefficient 1,6. Eau 3 250 g × 1,6 = 5 200 g.\n\nToujours vérifier l'**unité** (g, kg, L) et arrondir de façon raisonnable (au gramme pour la levure et le sel).", "anim": ""}]}, "video": ""}, {"id": "CU-MP", "titre": "Viandes, abats, boyaux et ingrédients", "court": "Matières premières", "poste": "Désossage", "domaine": "Matières premières", "bloc": "BC01 / BC02", "prerequis": "", "badge": "Maître des morceaux", "competences": [{"id": "VI-1", "libelle": "Situer les morceaux du porc et leurs utilisations", "pratique": false}, {"id": "VI-2", "libelle": "Distinguer les gras et les abats", "pratique": false}, {"id": "VI-3", "libelle": "Choisir et préparer les boyaux", "pratique": false}, {"id": "VI-4", "libelle": "Utiliser épices, sel nitrité et additifs avec rigueur", "pratique": false}, {"id": "VI-5", "libelle": "Réceptionner et stocker les viandes", "pratique": false}, {"id": "VI-6", "libelle": "Désosser et parer une pièce de porc", "pratique": true}], "fiche": {"duree": "8 min", "essentiel": ["Chaque morceau du porc a son usage : jambon, épaule, longe, poitrine, gorge, bardière, panne.", "Gras dur (bardière) et gras mou (panne) ne s'utilisent pas pareil.", "Boyaux naturels (menu, chaudin) ou artificiels (collagène, cellulose).", "Le sel nitrité se dose exactement selon la recette ; il ne remplace jamais le sel ordinaire au hasard.", "Viandes réceptionnées et stockées au froid, sans rupture de la chaîne du froid."], "sections": [{"t": "Les morceaux du porc", "md": "Morceau | Utilisations\nJambon (cuisse arrière) | Jambon cuit, jambon sec, rôtis\nÉpaule | Pâtés, saucisses, rillettes, épaule cuite\nLonge (côtes, filet) | Rôtis, côtes, filet mignon, lomo\nPoitrine | Lardons, poitrine fumée, petit salé, rillettes\nGorge | Gras et maigre mêlés : pâtés, farces, saucisses\nJarret | Jambonneau, potée\nTête, pieds, oreilles | Fromage de tête, pieds panés\n\n**Désosser :** retirer les os. **Parer :** retirer nerfs, cartilages, aponévroses et excès de gras. Les parures servent souvent aux farces.", "anim": ""}, {"t": "Les gras et les abats", "md": "Gras | Particularité | Utilisation\nBardière (gras dorsal) | Gras dur | Bardes, lardons, saucisses sèches\nPanne (gras autour des reins) | Gras mou | Saindoux, pâtés, rillettes\nGorge | Gras + maigre | Pâtés, farces\n\n**Abats :** foie (pâté de foie, mousse), langue, cœur, rognons, sang (boudin noir), tête. Ce sont des produits très fragiles : réception et usage rapides, au froid.\n\n**Barder :** envelopper d'une fine tranche de lard (barde) pour protéger une pièce à la cuisson.", "anim": ""}, {"t": "Les boyaux", "md": "Boyau | Origine | Exemples\nMenu de porc | Intestin grêle du porc | Saucisse de Toulouse, saucisse à cuire\nMenu de mouton | Intestin grêle du mouton, fin | Chipolatas, merguez\nChaudin | Gros intestin du porc | Andouille, certains boudins\nBoyaux artificiels | Collagène ou cellulose | Saucisses calibrées, saucisses pelées\n\nLes boyaux naturels sont livrés salés : on les **dessale** et on les rince à l'eau froide avant usage. On les garde au froid. Les boyaux de cellulose ne se mangent pas : on les retire après cuisson.", "anim": ""}, {"t": "Épices, sel nitrité et additifs", "md": "**Épices et aromates :** poivre, muscade, quatre-épices, ail, échalote, herbes. Pesés au gramme près.\n\n**Sel nitrité :** mélange de sel et de nitrite de sodium (additif E250). Il donne la couleur rose des salaisons, protège contre des bactéries dangereuses (dont celle du botulisme) et donne le goût « salaison ».\n- On l'utilise **uniquement** dans les recettes qui le prévoient, à la dose exacte.\n- On le stocke à part, dans un bac étiqueté, pour ne jamais le confondre avec le sel ordinaire.\n\n**Autres additifs** (ascorbate, phosphates…) : seulement s'ils sont prévus par la recette, aux doses autorisées, et déclarés sur l'étiquette.", "anim": ""}, {"t": "Réception et stockage des viandes", "md": "À la réception : température à cœur des viandes, aspect, odeur, emballage, étiquetage (dont la traçabilité de l'origine et le numéro de lot). Toute non-conformité est refusée ou isolée et notée.\n\nStockage : au froid, séparé (viandes crues / produits cuits), sur grilles ou bacs, jamais au sol, filmé et étiqueté. Les viandes hachées et les abats sont les plus fragiles. Les températures exactes sont celles du plan de maîtrise sanitaire de l'entreprise.\n\nAllergènes fréquents en charcuterie : moutarde, céleri, lait, œufs, gluten (chapelure, pâte), sulfites (vin), fruits à coque (pistaches).", "anim": ""}]}, "video": ""}, {"id": "CU-SAL", "titre": "Salaisons, saumures et fumage", "court": "Salaisons", "poste": "Saloir", "domaine": "Procédés et techniques", "bloc": "BC01", "prerequis": "TC-HS", "badge": "Saleur", "competences": [{"id": "SA-1", "libelle": "Expliquer le rôle du sel et du sel nitrité", "pratique": false}, {"id": "SA-2", "libelle": "Distinguer salage à sec et saumurage", "pratique": false}, {"id": "SA-3", "libelle": "Ordonner la fabrication d'un jambon cuit", "pratique": false}, {"id": "SA-4", "libelle": "Calculer une saumure", "pratique": false}, {"id": "SA-5", "libelle": "Expliquer le fumage", "pratique": false}, {"id": "SA-6", "libelle": "Préparer et injecter une saumure", "pratique": true}], "fiche": {"duree": "8 min", "essentiel": ["Le sel conserve en retirant l'eau disponible aux microbes et donne du goût.", "Salage à sec (jambon sec, lard) ou saumurage (jambon cuit, petit salé).", "Jambon cuit : saumure, injection, barattage, mise en moule, cuisson, refroidissement.", "Concentration d'une saumure = masse de sel ÷ volume d'eau (en g/L).", "Fumage : goût, couleur, meilleure conservation."], "sections": [{"t": "Le rôle du sel", "md": "Le sel :\n- **conserve** : il attire l'eau de la viande, qui n'est plus disponible pour les microbes ;\n- donne du **goût** ;\n- rend solubles des protéines de la viande : elles servent de **liant** (farces, jambon reconstitué).\n\nLe **sel nitrité** ajoute la couleur rose stable, la protection contre certaines bactéries dangereuses et l'arôme de salaison. Il se dose exactement.", "anim": ""}, {"t": "Salage à sec et saumurage", "md": "Méthode | Principe | Exemples\nSalage à sec | On frotte la pièce avec le sel (et les aromates), puis repos, séchage, affinage | Jambon sec, lard salé, coppa\nSaumurage par immersion | La pièce trempe dans la saumure | Petit salé, langue\nSaumurage par injection | On injecte la saumure dans la viande (pompe ou injecteuse), plus rapide et régulier | Jambon cuit, rôtis cuits\n\n**Saumure :** eau + sel nitrité, souvent avec sucre et aromates. Sa concentration se mesure (pèse-saumure) ou se calcule.\n\n**Barattage (malaxage) :** brassage de la viande saumurée dans un tonneau, parfois sous vide. Il répartit la saumure et fait ressortir les protéines qui lieront le jambon.", "anim": ""}, {"t": "Le jambon cuit pas à pas", "anim": "", "md": "1. Désosser et parer le jambon.\n2. Préparer la saumure (pesée exacte).\n3. Injecter la saumure, de façon régulière.\n4. Baratter (malaxer) puis laisser reposer au froid.\n5. Mettre en moule (ou en sac de cuisson), presser.\n6. Cuire jusqu'à la température à cœur de la fiche technique, contrôlée à la sonde.\n7. Refroidir rapidement en cellule.\n8. Démouler, conditionner, étiqueter."}, {"t": "Calculer une saumure", "md": "**Concentration (g/L) = masse de sel (g) ÷ volume d'eau (L).**\n\nExemple : 2 kg de sel nitrité dans 20 L d'eau → 2 000 ÷ 20 = **100 g/L**.\n\nPour préparer une saumure à une concentration donnée : **masse de sel = concentration × volume**. Pour 15 L à 120 g/L : 120 × 15 = 1 800 g.\n\n**Taux d'injection** = poids de saumure injectée ÷ poids de viande × 100. Exemple : 2 kg de saumure dans 10 kg de jambon = 20 %.", "anim": ""}, {"t": "Le fumage", "md": "On expose les produits à la fumée de bois (hêtre, par exemple), dans un fumoir.\n\n- **Fumage à froid** (fumée peu chaude) : jambons secs, saumon, certaines saucisses ; on ne cuit pas le produit.\n- **Fumage à chaud** : le produit fume et cuit en même temps (saucisses, poitrine).\n\nLe fumage donne du goût et de la couleur, sèche la surface et aide à la conservation.", "anim": ""}]}, "video": ""}, {"id": "CU-FARCES", "titre": "Hachage, farces, saucisses et pâtés", "court": "Farces", "poste": "Hachoir", "domaine": "Procédés et techniques", "bloc": "BC01", "prerequis": "TC-HS", "badge": "Roi de la mêlée", "competences": [{"id": "FA-1", "libelle": "Choisir le hachage selon le produit", "pratique": false}, {"id": "FA-2", "libelle": "Expliquer la liaison et le maintien au froid", "pratique": false}, {"id": "FA-3", "libelle": "Embosser et portionner des saucisses", "pratique": false}, {"id": "FA-4", "libelle": "Réaliser pâtés, terrines, rillettes, boudin", "pratique": false}, {"id": "FA-5", "libelle": "Diagnostiquer un défaut de farce", "pratique": false}, {"id": "FA-6", "libelle": "Fabriquer et embosser une saucisse régulière", "pratique": true}], "fiche": {"duree": "10 min", "essentiel": ["Hachage gros (Toulouse), fin (chair à saucisse), au cutter (farce fine, émulsion).", "Viande, gras et matériel bien froids : sinon la farce graisse et rend son gras à la cuisson.", "Le sel fait ressortir les protéines : elles lient la mêlée.", "Embosser sans bulles d'air, portionner, ficeler.", "Boudin noir : pocher sans bouillir, sinon il éclate."], "sections": [{"t": "Hacher et mélanger", "md": "Outil | Résultat | Exemples\nHachoir à grille grosse | Morceaux visibles | Saucisse de Toulouse, pâté de campagne\nHachoir à grille fine | Chair fine | Chair à saucisse, farces\nCutter | Pâte très fine, émulsion | Saucisse de Strasbourg, mousse de foie, farce fine\n\nLa **mêlée** est le mélange de viandes, gras, sel, épices et liants. On la malaxe juste assez pour qu'elle « colle » : le sel a fait ressortir les protéines qui lient la farce.\n\n**Sécurité :** pousse-viande obligatoire au hachoir, jamais les doigts. Couvercle du cutter fermé.", "anim": ""}, {"t": "Le froid, clé des farces réussies", "md": "La viande, le gras et le matériel doivent rester **bien froids** pendant tout le travail :\n- hygiène : les viandes hachées sont très sensibles aux microbes ;\n- qualité : au chaud, le gras fond, l'émulsion casse et la farce **graisse** (elle rend son gras à la cuisson).\n\nAu cutter, on ajoute souvent de la **glace pilée** pour garder la mêlée froide. On travaille par petites quantités et on remet au froid aussitôt.\n\n**Liants possibles :** protéines de la viande (grâce au sel), œufs, crème, panade, farine selon la recette.", "anim": ""}, {"t": "Embosser les saucisses", "md": "1. Dessaler et rincer les boyaux naturels.\n2. Charger le poussoir sans air.\n3. Enfiler le boyau sur l'embout (l'entonnoir), sans le serrer.\n4. Embosser régulièrement : boyau bien rempli, sans être trop tendu (il éclaterait à la cuisson).\n5. Piquer les bulles d'air avec une aiguille.\n6. Portionner : tourner les saucisses, ou ficeler, à longueur régulière.\n7. Stocker au froid, étiqueter.", "anim": ""}, {"t": "Pâtés, terrines, rillettes, boudin", "md": "Produit | Points clés\nPâté de campagne | Gorge, foie, oignons, œufs, épices ; cuit en terrine au bain-marie, au four, contrôlé à cœur\nTerrine | Farce + éléments (volaille, gibier, légumes) moulés, souvent bardés\nRillettes | Viande cuite très longuement dans sa graisse, puis effilochée\nBoudin noir | Sang, gras, oignons ; embossé puis **poché sans bouillir** (sinon il éclate)\nSaucisse de Toulouse | Hachage gros, menu de porc, sel, poivre\n\nAprès cuisson, les pâtés sont refroidis rapidement, parfois pressés, puis couverts (graisse ou gelée).", "anim": ""}, {"t": "Défauts : causes et remèdes", "md": "Défaut | Causes probables | Remède\nLa farce rend son gras à la cuisson | Mêlée trop chaude, émulsion cassée | Matériel froid, glace pilée, petites quantités\nLa farce s'émiette | Pas assez malaxée, manque de sel ou de liant | Malaxer jusqu'à ce qu'elle colle, respecter la recette\nSaucisses qui éclatent | Trop embossées, cuisson trop forte | Embosser moins serré, cuire doucement, piquer les bulles\nBoudin éclaté | Eau qui bout | Pocher en dessous de l'ébullition\nPâté avec un trou ou du jus | Cuisson trop forte, farce mal tassée | Bain-marie, tasser, contrôler à cœur", "anim": ""}]}, "video": ""}, {"id": "CU-TRAIT", "titre": "Produits traiteur et pâtisserie charcutière", "court": "Traiteur", "poste": "Garde-manger", "domaine": "Procédés et techniques", "bloc": "BC01", "prerequis": "TC-HS", "badge": "Chef traiteur", "competences": [{"id": "TR-1", "libelle": "Réaliser les pâtes et appareils traiteur", "pratique": false}, {"id": "TR-2", "libelle": "Réaliser les sauces de base", "pratique": false}, {"id": "TR-3", "libelle": "Monter un pâté en croûte", "pratique": false}, {"id": "TR-4", "libelle": "Préparer entrées froides et végétaux en sécurité", "pratique": false}, {"id": "TR-5", "libelle": "Dresser et présenter les produits traiteur", "pratique": false}, {"id": "TR-6", "libelle": "Réaliser un pâté en croûte décoré", "pratique": true}], "fiche": {"duree": "9 min", "essentiel": ["Quiche : pâte brisée + appareil à crème prise (œufs, crème, lait).", "Mayonnaise : émulsion froide jaune + moutarde + huile, huile versée en filet.", "Béchamel = roux blanc + lait ; velouté = roux blond + fond.", "Pâté en croûte : pâte, farce, cheminée ; gelée coulée après refroidissement.", "Végétaux crus : lavés et décontaminés avant usage."], "sections": [{"t": "Pâtes et appareils", "md": "Préparation | Composition repère | Utilisation\nPâte brisée | Farine, beurre (ou saindoux), sel, eau, jaune | Quiches, tourtes\nPâte à pâté | Pâte brisée riche, plus ferme | Pâté en croûte\nPâte feuilletée | Détrempe + beurre de tourage | Bouchées, feuilletés, friands\nAppareil à crème prise | Œufs, crème, lait, sel, poivre, muscade | Quiche lorraine, flans salés\n\nL'appareil à crème prise **coagule** à la cuisson : on cuit doucement pour qu'il reste lisse, sans bulles ni eau.", "anim": ""}, {"t": "Les sauces de base", "md": "Sauce | Principe | Utilisation\nMayonnaise | Émulsion froide : jaune + moutarde, huile en filet, vinaigre, sel | Entrées, salades\nBéchamel | Roux blanc (beurre + farine) + lait | Croque, gratins, bouchées\nVelouté | Roux blond + fond blanc | Base des sauces blanches\nSauce suprême | Velouté + crème | Bouchée à la reine\n\n**Mayonnaise réussie :** ingrédients à la même température, huile versée en filet au début. Si elle tourne, on repart d'un jaune et on incorpore la sauce ratée petit à petit.\n\n**Hygiène :** la mayonnaise à l'œuf cru est un produit très sensible : œufs frais ou ovoproduits pasteurisés, fabrication en petite quantité, conservation au froid, durée courte.", "anim": ""}, {"t": "Le pâté en croûte", "md": "1. Préparer la pâte à pâté la veille, la laisser reposer au froid.\n2. Préparer la farce et les garnitures (marinées si besoin).\n3. Foncer le moule (chemisé de pâte), garnir de farce, bien tasser.\n4. Couvrir d'un couvercle de pâte, souder les bords, décorer.\n5. Faire une ou deux **cheminées** pour laisser sortir la vapeur.\n6. Dorer, cuire, contrôler la température à cœur à la sonde.\n7. Refroidir rapidement.\n8. Couler de la **gelée** par la cheminée pour combler le vide entre la pâte et la farce.\n9. Laisser prendre au froid, démouler, trancher.", "anim": ""}, {"t": "Entrées froides et végétaux", "md": "- Les légumes et herbes crus sont **lavés puis décontaminés** (bain dans une solution adaptée, puis rinçage), selon le protocole de l'entreprise.\n- Les salades composées s'assemblent au froid, au dernier moment si possible.\n- Les **gelées** (aspic) se préparent avec un fond clarifié et de la gélatine ; on les coule sur des produits bien froids.\n- Œufs durs, crudités, salades de pommes de terre : stockés au froid, filmés, étiquetés.", "anim": ""}, {"t": "Dresser et présenter", "md": "- Plats propres et adaptés, portions régulières.\n- Couleurs contrastées, décor simple et comestible.\n- Produits filmés, étiquetés (nom, date, allergènes).\n- En vitrine réfrigérée, les plus anciens devant.\n\nUn buffet se prépare au froid et sort au dernier moment. Les produits restés trop longtemps à température ambiante ne se remettent pas en vente.", "anim": ""}]}, "video": ""}, {"id": "CU-CUIS", "titre": "Cuire, refroidir, conditionner", "court": "Cuisson", "poste": "Cellule", "domaine": "Procédés et hygiène", "bloc": "BC01 / BC02", "prerequis": "TC-HS", "badge": "Gardien de la chaîne", "competences": [{"id": "CC-1", "libelle": "Choisir le mode de cuisson et contrôler à cœur", "pratique": false}, {"id": "CC-2", "libelle": "Refroidir et remettre en température", "pratique": false}, {"id": "CC-3", "libelle": "Conditionner sous vide et étiqueter", "pratique": false}, {"id": "CC-4", "libelle": "Trancher et stocker en sécurité", "pratique": false}, {"id": "CC-5", "libelle": "Assurer la traçabilité des fabrications", "pratique": false}], "fiche": {"duree": "8 min", "essentiel": ["La température à cœur se contrôle à la sonde, selon la fiche technique.", "Refroidir de +63 °C à +10 °C en moins de 2 heures, en cellule.", "Remettre en température : atteindre +63 °C à cœur en moins d'une heure.", "Le sous-vide protège de l'air et allonge la durée de vie, mais ne remplace pas le froid.", "Étiquette : dénomination, ingrédients, allergènes, DLC, conservation, lot, poids."], "sections": [{"t": "Cuire et contrôler", "md": "Mode | Principe | Exemples\nPocher | Dans un liquide frémissant, sans bouillir | Boudin, saucisses, jambon\nRôtir | Au four, à sec | Rôtis, échine\nBraiser | Cuisson longue, couverte, avec liquide | Joues, langue\nCuire au bain-marie | Moule dans l'eau, au four | Pâtés, terrines\nCuire sous vide | Produit sous vide, basse température contrôlée | Jambon, rôtis\nFour mixte (vapeur) | Chaleur et vapeur combinées | Jambons, pièces cuites\n\nLa **sonde** se plante au cœur du produit (la partie la plus épaisse). La température à atteindre est fixée par la fiche technique ; on la note sur la fiche de suivi.", "anim": ""}, {"t": "Refroidir et remettre en température", "anim": "thermo", "md": "**Refroidissement rapide :** de +63 °C à +10 °C en moins de 2 heures, en cellule de refroidissement, en portions ou couches peu épaisses. Ensuite, stockage au froid.\n\n**Remise en température :** un plat cuisiné refroidi doit atteindre **+63 °C à cœur en moins d'une heure**, puis être servi ou maintenu au chaud au-dessus de +63 °C.\n\nEntre +10 et +63 °C, les bactéries se multiplient vite : on y passe le moins de temps possible."}, {"t": "Conditionner et étiqueter", "md": "**Sous vide :** on retire l'air avant de souder le sachet (machine à cloche). Le produit s'oxyde moins et se conserve plus longtemps, **mais toujours au froid** : le vide ne remplace pas la réfrigération.\n\n**Atmosphère protectrice :** l'air est remplacé par un mélange de gaz.\n\nMentions d'étiquetage d'un produit préemballé :\n- dénomination du produit ;\n- liste des ingrédients, avec les **allergènes mis en évidence** ;\n- poids net ;\n- DLC et conditions de conservation ;\n- numéro de lot ;\n- nom et adresse de l'entreprise.", "anim": ""}, {"t": "Trancher et stocker", "md": "- **Trancheuse :** protège-lame en place, poussoir, gant de maille pour le nettoyage, machine débranchée pour la nettoyer.\n- Les produits tranchés ont une durée de vie plus courte que les pièces entières : date d'ouverture ou de tranchage sur l'étiquette.\n- Stockage au froid, filmé, séparé des produits crus.\n- On nettoie et désinfecte la trancheuse entre deux familles de produits et régulièrement dans la journée.", "anim": ""}, {"t": "Traçabilité", "md": "Pour chaque fabrication, on note sur la **fiche de production** : date, produit, numéros de lot des matières premières, quantités, température à cœur, heure et fin du refroidissement, nouveau numéro de lot du produit fini.\n\nEn cas de problème (rappel d'un lot de viande, client malade), on retrouve en quelques minutes quels produits sont concernés et à qui ils ont été vendus.", "anim": ""}]}, "video": ""}], "questions": [{"id": "HS01", "module": "TC-HS", "competence": "HS-1", "type": "multi", "enonce": "Quand dois-tu te laver les mains ? Coche toutes les bonnes réponses.", "choix": ["En arrivant à mon poste", "Après être allé aux toilettes", "Après avoir cassé des œufs en coquille", "Seulement toutes les 2 heures", "Après m'être mouché"], "bonnes": [0, 1, 2, 4], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "En arrivant au poste, après les toilettes, après s'être mouché, après avoir touché des déchets ou des œufs en coquille. Un rythme fixe ne suffit pas : on se lave les mains à chaque changement d'activité à risque.", "points": [], "requis": 0, "image": ""}, {"id": "HS02", "module": "TC-HS", "competence": "HS-2", "type": "qcm", "enonce": "Quelles sont les 3 familles de dangers en alimentation ?", "choix": ["Biologique, chimique, physique", "Chaud, froid, tiède", "Microbes, virus, levures", "Cru, cuit, congelé"], "bonnes": [0], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Biologique (microbes), chimique (produit de nettoyage, pesticide) et physique (cheveu, verre, coquille). Les allergènes sont souvent ajoutés comme danger à part.", "points": [], "requis": 0, "image": ""}, {"id": "HS03", "module": "TC-HS", "competence": "HS-1", "type": "vf", "enonce": "Nettoyer et désinfecter, c'est la même chose.", "choix": ["Vrai", "Faux"], "bonnes": [1], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Faux. Nettoyer enlève les salissures visibles. Désinfecter détruit les micro-organismes. On nettoie d'abord, sinon le désinfectant agit mal.", "points": [], "requis": 0, "image": ""}, {"id": "HS04", "module": "TC-HS", "competence": "HS-2", "type": "qcm", "enonce": "Que veut dire « marche en avant » ?", "choix": ["Les produits propres ne croisent jamais les produits sales ni les déchets", "On commence toujours par les produits les plus chers", "On range les produits du plus récent au plus ancien", "On travaille toujours de gauche à droite"], "bonnes": [0], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Les produits propres ne croisent jamais les produits sales ni les déchets. Le circuit va du sale vers le propre, sans retour en arrière.", "points": [], "requis": 0, "image": ""}, {"id": "HS05", "module": "TC-HS", "competence": "HS-3", "type": "qcm", "enonce": "L'étiquette d'une crème liquide indique « à conserver entre 0 et +4 °C ». Elle arrive à +9 °C. Que fais-tu ?", "choix": ["Je la range vite en chambre froide", "Je refuse la livraison et je le note sur la fiche de réception", "Je l'utilise tout de suite pour une cuisson", "Je la mets au congélateur"], "bonnes": [1], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": true, "echange": [], "explication": "La chaîne du froid est rompue : on refuse le produit (ou on l'isole) et on le note sur la fiche de réception. On ne le met pas en stock pour « le refroidir ».", "points": [], "requis": 0, "image": ""}, {"id": "HS06", "module": "TC-HS", "competence": "HS-3", "type": "qcm", "enonce": "Que signifie PEPS ?", "choix": ["Premier entré, premier sorti", "Produit en promotion, produit en stock", "Pesée exacte par sachet", "Plan d'entretien des postes"], "bonnes": [0], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Premier entré, premier sorti : on utilise d'abord les produits livrés en premier. On range les nouveaux derrière les anciens.", "points": [], "requis": 0, "image": ""}, {"id": "HS07", "module": "TC-HS", "competence": "HS-3", "type": "qcm", "enonce": "Un pot de crème a une DLC dépassée d'un jour. Que fais-tu ?", "choix": ["Je l'utilise, un jour ce n'est rien", "Je le goûte avant de décider", "Je l'écarte, il ne doit pas être utilisé", "Je le cuis pour le rendre sûr"], "bonnes": [2], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": true, "echange": [], "explication": "DLC = « à consommer jusqu'au ». Une fois dépassée, le produit peut être dangereux : on l'écarte. La DDM (« de préférence avant ») concerne seulement la qualité.", "points": [], "requis": 0, "image": ""}, {"id": "HS08", "module": "TC-HS", "competence": "HS-3", "type": "qcm", "enonce": "À quelle température conserve-t-on une pâtisserie garnie de crème pâtissière ?", "choix": ["Entre 0 et +3 °C", "Entre +8 et +10 °C", "À température ambiante", "Entre +12 et +15 °C"], "bonnes": [0], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Entre 0 et +3 °C. Les crèmes aux œufs et au lait sont des produits très fragiles.", "points": [], "requis": 0, "image": ""}, {"id": "HS09", "module": "TC-HS", "competence": "HS-1", "type": "ordre", "enonce": "Remets dans l'ordre le nettoyage-désinfection d'un plan de travail.", "choix": ["Retirer les déchets et les restes", "Nettoyer avec un détergent", "Rincer", "Désinfecter en respectant le temps d'action", "Rincer si le produit l'exige", "Laisser sécher"], "bonnes": [], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "On retire d'abord les déchets, puis on nettoie, on rince, on désinfecte en respectant le temps d'action, on rince si le produit l'exige, et on laisse sécher.", "points": [], "requis": 0, "image": ""}, {"id": "HS10", "module": "TC-HS", "competence": "HS-2", "type": "assoc", "enonce": "Relie chaque situation à la famille de danger.", "choix": [], "bonnes": [], "paires": [["Un cheveu dans un gâteau", "Physique"], ["Des salmonelles dans des œufs", "Biologique"], ["Un reste de produit vaisselle dans un cul-de-poule", "Chimique"], ["Un morceau de coquille dans une crème", "Physique"]], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Cheveu et morceau de coquille = physique. Salmonelle = biologique. Reste de produit vaisselle = chimique.", "points": [], "requis": 0, "image": ""}, {"id": "HS11", "module": "TC-HS", "competence": "HS-2", "type": "qcm", "enonce": "Une crème cuite doit refroidir vite. Quelle est la règle ?", "choix": ["De +63 °C à +10 °C en moins de 2 heures", "De +100 °C à +50 °C en 6 heures", "On la laisse refroidir sur le plan de travail jusqu'au lendemain", "De +63 °C à +30 °C en 4 heures"], "bonnes": [0], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": true, "echange": [], "explication": "Passer de +63 °C à +10 °C en moins de 2 heures, en cellule de refroidissement. Entre +10 et +63 °C, les bactéries se multiplient très vite.", "points": [], "requis": 0, "image": ""}, {"id": "HS12", "module": "TC-HS", "competence": "HS-1", "type": "vf", "enonce": "Au labo, on retire bijoux et montre avant de travailler.", "choix": ["Vrai", "Faux"], "bonnes": [0], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Vrai. Les bijoux gardent des microbes et peuvent tomber dans les produits (danger physique).", "points": [], "requis": 0, "image": ""}, {"id": "FE01", "module": "PR-FEU", "competence": "FEU-2", "type": "qcm", "enonce": "Qu'est-ce qui fait lever une pâte feuilletée ?", "choix": ["La levure de boulanger", "La levure chimique", "La vapeur d'eau bloquée entre les couches", "L'air incorporé au pétrissage"], "bonnes": [2], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Il n'y a aucune levure. À la cuisson, l'eau devient vapeur ; les couches de beurre l'empêchent de s'échapper, alors elle soulève les feuillets. D'où la cuisson à four chaud.", "points": [], "requis": 0, "image": ""}, {"id": "FE02", "module": "PR-FEU", "competence": "FEU-1", "type": "multi", "enonce": "Coche les ingrédients de base d'une détrempe.", "choix": ["Farine", "Eau", "Sel", "Sucre", "Œufs", "Levure"], "bonnes": [0, 1, 2], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Farine, eau, sel. On ajoute parfois un peu de beurre fondu. Sucre et œufs appartiennent à d'autres pâtes.", "points": [], "requis": 0, "image": ""}, {"id": "FE03", "module": "PR-FEU", "competence": "FEU-3", "type": "ordre", "enonce": "Remets dans l'ordre les étapes d'un feuilletage classique.", "choix": ["Peser les ingrédients", "Réaliser la détrempe sans la corser", "Bouler, inciser en croix, reposer au froid", "Préparer le beurre de tourage à la même consistance", "Enfermer le beurre dans la détrempe", "Donner 2 tours simples puis reposer au froid (3 fois)", "Abaisser et détailler"], "bonnes": [], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [[2, 3]], "explication": "Le repos au froid arrive avant l'enveloppement et entre chaque série de tours. Les étapes 3 et 4 peuvent vite possible : de +63 °C à +10 °C en moins de 2 heures, en cellule de refroidissement, en couche fine et filmée au contact. Ensuite on la stocke entre 0 et +3 °C.", "points": [{"label": "Les bactéries (microbes) se multiplient", "mots": ["bacter", "microb", "germe", "multipli", "developp", "prolif"]}, {"label": "Zone de danger entre +10 et +63 °C", "mots": ["63", "zone", "danger", "tiede"]}, {"label": "En moins de 2 heures", "mots": ["2 h", "2h", "deux heure", "2 heure", "moins de 2"]}, {"label": "En cellule de refroidissement", "mots": ["cellule"]}], "requis": 2, "image": ""}, {"id": "HSO2", "module": "TC-HS", "competence": "HS-3", "type": "ouverte", "enonce": "Une livraison arrive. Cite au moins 3 contrôles que tu fais avant de ranger les produits.", "choix": [], "bonnes": [], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Je contrôle : la température des produits frais et surgelés, l'état de l'emballage (intact, propre), les dates (DLC, DDM), l'étiquetage (dont le numéro de lot), l'aspect et l'odeur. Je note tout sur la fiche de réception et je range aussitôt au froid.", "points": [{"label": "La température", "mots": ["temperat", "thermom", "°", "degre"]}, {"label": "L'emballage", "mots": ["emballage", "carton", "abime", "intact", "dechir"]}, {"label": "Les dates (DLC / DDM)", "mots": ["dlc", "ddm", "date", "peremp"]}, {"label": "L'étiquetage / le lot", "mots": ["etiquet", "lot", "tracab"]}, {"label": "L'aspect, l'odeur", "mots": ["aspect", "odeur", "couleur", "propre"]}], "requis": 3, "image": ""}, {"id": "HSO3", "module": "TC-HS", "competence": "HS-2", "type": "ouverte", "enonce": "Explique avec tes mots ce qu'est la marche en avant.", "choix": [], "bonnes": [], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Les produits avancent toujours du sale vers le propre, de la réception jusqu'à la vente, sans jamais revenir en arrière. Les circuits propres et sales (déchets, vaisselle sale) ne se croisent pas ; sinon on les sépare dans le temps, avec un nettoyage entre les deux.", "points": [{"label": "Du sale vers le propre", "mots": ["sale", "propre"]}, {"label": "Sans retour en arrière", "mots": ["arriere", "revenir", "retour", "sens unique"]}, {"label": "Les circuits ne se croisent pas", "mots": ["crois", "melang", "separ", "contact"]}, {"label": "Exemple d'étapes (réception, stockage, préparation…)", "mots": ["recept", "stock", "prepar", "cuisson", "vente"]}], "requis": 2, "image": ""}, {"id": "FEO1", "module": "PR-FEU", "competence": "FEU-2", "type": "ouverte", "enonce": "Explique avec tes mots pourquoi une pâte feuilletée lève alors qu'elle n'a pas de levure.", "choix": [], "bonnes": [], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Au four chaud, l'eau de la détrempe et du beurre se transforme en vapeur. Les couches de beurre empêchent la vapeur de s'échapper : elle soulève chaque feuillet. Puis la pâte cuit et se fige.", "points": [{"label": "L'eau se transforme en vapeur", "mots": ["vapeur", "evapor"]}, {"label": "Les couches de beurre bloquent / séparent", "mots": ["beurre", "couche", "feuillet", "bloqu", "empech"]}, {"label": "La vapeur soulève les feuillets", "mots": ["souleve", "pousse", "gonfle", "leve", "monte"]}, {"label": "Il faut un four chaud", "mots": ["four chaud", "chaleur", "chaud"]}], "requis": 2, "image": ""}, {"id": "FEO2", "module": "PR-FEU", "competence": "FEU-6", "type": "ouverte", "enonce": "Tes chaussons ont rétréci à la cuisson. Donne une cause et ce que tu feras la prochaine fois.", "choix": [], "bonnes": [], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "La détrempe a été trop pétrie (corsée) ou n'a pas assez reposé : le gluten, trop élastique, se rétracte à la cuisson. La prochaine fois, je mélange la détrempe juste ce qu'il faut, je respecte les repos au froid entre les tours et je laisse reposer les pièces détaillées avant d'enfourner.", "points": [{"label": "Pâte trop travaillée / corsée", "mots": ["corse", "trop petri", "trop travaill", "trop melang", "petri"]}, {"label": "Manque de repos", "mots": ["repos", "reposer"]}, {"label": "Le gluten est élastique", "mots": ["gluten", "elasti"]}, {"label": "Remède : respecter les repos au froid / ne pas corser", "mots": ["respect", "froid", "laisser repos", "prochaine fois", "je ferai", "je vais"]}], "requis": 2, "image": ""}, {"id": "CHO1", "module": "PR-CHOUX", "competence": "CH-1", "type": "ouverte", "enonce": "À quoi sert le dessèchement de la panade ? Explique.", "choix": [], "bonnes": [], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Le dessèchement évapore l'eau en trop de la panade. Plus sèche, elle peut absorber plus d'œufs. Les choux sont alors plus élastiques et gonflent mieux au four. On dessèche 1 à 2 minutes, jusqu'à ce que la pâte se décolle et laisse un film au fond.", "points": [{"label": "Évaporer l'eau", "mots": ["evapor", "eau", "secher", "humid"]}, {"label": "Absorber plus d'œufs", "mots": ["oeuf", "œuf", "absorb"]}, {"label": "Les choux gonflent mieux", "mots": ["gonfl", "leve", "develop", "monte"]}, {"label": "Repère : la pâte se décolle, film au fond", "mots": ["film", "decoll", "boule"]}], "requis": 2, "image": ""}, {"id": "CHO2", "module": "PR-CHOUX", "competence": "CH-3", "type": "ouverte", "enonce": "Tes choux sont retombés en sortant du four. Explique ce qui s'est passé et comment l'éviter.", "choix": [], "bonnes": [], "paires": [], "reponse": null, "tolerance": 0, "unite": "", "critique": false, "echange": [], "explication": "Soit le four a été ouvert trop tôt : la vapeur s'est échappée avant que la pâte soit figée. Soit les choux n'étaient pas assez cuits : l'intérieur est resté humide et s'est affaissé. Pour l'éviter : ne pas ouvrir le four pendant le développement et function parseCSV(t){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < t.length; i++){ const ch = t[i];
    if(q){ if(ch === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if(ch === '"') q = true; else if(ch === ","){ row.push(f); f = ""; } else if(ch === "\n"){ row.push(f); rows.push(row); row = []; f = ""; } else if(ch !== "\r") f += ch; }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim());
  return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}
async function sheet(name){
  const u = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(CONFIG.sheetId)}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const r = await fetch(u, {cache:"no-store"}); if(!r.ok) throw new Error("Onglet « " + name + " » illisible (" + r.status + ")"); return parseCSV(await r.text());
}
async function loadSheet(){
  const [mods, comps, qs, fis, gl, fo] = await Promise.all(["Modules", "Compétences", "Questions", "Fiches", "Glossaire", "Formations"].map(n => sheet(n).catch(e => ["Fiches", "Glossaire", "Formations"].includes(n) ? [] : Promise.reject(e))));
  const errors = [], yes = v => /^(oui|vrai|x|1|yes)$/i.test(v || "");
  const modules = mods.filter(m => m["ID"]).map(m => {
    const b = BUILTIN.modules.find(x => x.id === m["ID"]);
    return {id:m["ID"], titre:m["Titre"] || m["ID"], court:m["Nom court"] || (b && b.court) || m["Titre"], poste:m["Poste (carte du labo)"] || "", domaine:m["Domaine"] || "",
      bloc:m["Bloc RNCP"] || "", prerequis:m["Prérequis"] || "", badge:m["Badge"] || m["Titre"], video:m["Lien vidéo (facultatif)"] || "",
      competences:[], fiche:(b && b.fiche) ? JSON.parse(JSON.stringify(b.fiche)) : {duree:m["Durée de lecture"] || "", essentiel:[], sections:[]}};
  });
  const MM = Object.fromEntries(modules.map(m => [m.id, m]));
  comps.forEach(c => { const m = MM[c["Module"]]; if(!m || !c["ID"]){ errors.push(`Compétence ${c["ID"] || "?"} : module inconnu`); return; }
    m.competences.push({id:c["ID"], libelle:c["Libellé"], pratique:yes(c["Pratique (validée par le formateur)"])}); });
  const fbm = {}; fis.forEach(f => { if(MM[f["Module"]]) (fbm[f["Module"]] = fbm[f["Module"]] || []).push(f); });
  mods.forEach(m => { if(MM[m["ID"]] && m["Durée de lecture"]) MM[m["ID"]].fiche.duree = m["Durée de lecture"]; });
  Object.entries(fbm).forEach(([mid, rows]) => { const m = MM[mid]; rows.sort((a, b) => (+a["Ordre"] || 0) - (+b["Ordre"] || 0));
    m.fiche.sections = []; m.fiche.essentiel = [];
    rows.forEach(r => { if(/^l'essentiel/i.test(r["Titre"])) m.fiche.essentiel = (r["Texte"] || "").split("\n").map(x => x.replace(/^-\s*/, "").trim()).filter(Boolean);
      else if(r["Titre"] === "Durée") m.fiche.duree = r["Texte"];
      else m.fiche.sections.push({t:r["Titre"], md:r["Texte"] || "", anim:ANIMS[r["Animation"]] ? r["Animation"] : ""}); }); });
  const cmod = {}; modules.forEach(m => m.competences.forEach(c => cmod[c.id] = m.id));
  const questions = [];
  qs.forEach(r => { const id = r["ID"], type = (r["Type"] || "").toLowerCase(); if(!id) return;
    const where = `Question ${id}`, choix = [1,2,3,4,5,6,7].map(i => r["Choix " + i]).filter(Boolean);
    if(!MM[r["Module"]]) return errors.push(`${where} : module inconnu`);
    if(cmod[r["Compétence"]] !== r["Module"]) return errors.push(`${where} : compétence absente du module`);
    const q = {id, module:r["Module"], competence:r["Compétence"], type, enonce:r["Énoncé"], explication:r["Explication (correction)"] || "", choix:[], bonnes:[], paires:[],
      reponse:null, tolerance:0, unite:r["Unité"] || "", critique:yes(r["Critique"]), echange:[], points:[], requis:0, image:r["Image (lien)"] || ""};
    const nums = (r["Bonnes réponses"] || "").split(/[;,\s]+/).map(x => parseInt(x, 10) - 1).filter(x => x >= 0);
    if(type === "qcm" || type === "vf" || type === "multi"){ q.choix = choix; q.bonnes = nums;
      if(!choix.length || !nums.length || nums.some(n => n >= choix.length) || (type !== "multi" && nums.length !== 1)) return errors.push(`${where} : bonnes réponses à vérifier`); }
    else if(type === "ordre"){ q.choix = choix; if(choix.length < 3) return errors.push(`${where} : au moins 3 étapes`);
      const e = (r["Ordre : échange toléré"] || "").match(/(\d+)\s*[-;,]\s*(\d+)/); if(e) q.echange = [[+e[1] - 1, +e[2] - 1]]; }
    else if(type === "assoc"){ q.paires = choix.map(c => c.split(/\s=\s|=/)).filter(p => p.length === 2).map(p => [p[0].trim(), p[1].trim()]);
      if(q.paires.length < 3) return errors.push(`${where} : au moins 3 paires « terme = définition »`); }
    else if(type === "calcul"){ q.reponse = parseFloat((r["Réponse"] || "").replace(",", ".")); q.tolerance = parseFloat((r["Tolérance"] || "0").replace(",", ".")) || 0;
      if(isNaN(q.reponse)) return errors.push(`${where} : réponse numérique manquante`); }
    else if(type === "ouverte"){ q.points = choix.map(c => { const i = c.indexOf(":"); return i < 0 ? {label:c, mots:[]} : {label:c.slice(0, i).trim(), mots:c.slice(i + 1).split(",").map(x => x.trim()).filter(Boolean)}; });
      q.requis = parseInt(r["Bonnes réponses"], 10) || 1; if(!q.points.length) return errors.push(`${where} : points clés manquants`); }
    else return errors.push(`${where} : type « ${type} » inconnu`);
    questions.push(q); });
  if(!modules.length || !questions.length) throw new Error("Tableur vide ou mal nommé.");
  const glossaire = gl.length ? gl.filter(g => g["Terme"]).map(g => ({terme:g["Terme"], definition:g["Définition"]})) : BUILTIN.glossaire;
  const formations = fo.length ? fo.filter(f => f["ID"]).map(f => ({id:f["ID"], titre:f["Titre"] || f["ID"], metier:f["Métier"] || "", rncp:f["RNCP"] || "",
      modules:(f["Modules (séparés par ;)"] || "").split(/[;,]/).map(x => x.trim()).filter(x => { if(x && !MM[x]){ errors.push(`Formation ${f["ID"]} : module ${x} inconnu`); return false; } return !!x; }),
      blocs:Object.fromEntries((f["Blocs (module=bloc ; …)"] || "").split(";").map(x => x.split("=").map(y => y.trim())).filter(x => x.length === 2 && x[0]))}))
    : BUILTIN.formations;
  return {data:{version:"tableur", formations, modules, questions, glossaire}, info:{source:"tableur", errors, n:questions.length, at:new Date().toLocaleString("fr-FR")}};
}

function today(){ return Math.floor((Date.now() - new Date().getTimezoneOffset()*6e4)/864e5) + (S.offset||0); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(t){ return String(t).toLowerCase().replace(/œ/g, "oe").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " "); }
function fmt(n){ const s = String(n).split("."); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (s[1] ? "," + s[1] : ""); }
function md(src){
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  return String(src || "").replace(/\r/g, "").split(/\n\s*\n/).map(b => { const L = b.split("\n").map(x => x.trim()).filter(Boolean); if(!L.length) return "";
    if(L.every(l => /^- /.test(l))) return `<ul>${L.map(l => `<li>${inl(l.slice(2))}</li>`).join("")}</ul>`;
    if(L.every(l => /^\d+\.\s/.test(l))) return `<ol>${L.map(l => `<li>${inl(l.replace(/^\d+\.\s/, ""))}</li>`).join("")}</ol>`;
    if(L.length >= 2 && L.every(l => l.includes("|"))){ const R = L.map(l => l.split("|").map(c => c.trim())), n = Math.max(...R.map(r => r.length));
      const h = R[0], hasHead = h.some(Boolean);
      return `<div class="tw"><table class="tbl">${hasHead ? `<thead><tr>${Array.from({length:n}, (_, i) => `<th>${inl(h[i] || "")}</th>`).join("")}</tr></thead>` : ""}<tbody>${R.slice(1).map(r => `<tr>${Array.from({length:n}, (_, i) => `<td>${inl(r[i] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
    return `<p>${L.map(inl).join("<br>")}</p>`; }).join("");
}

function st(cid){ return (S.c[cid] && S.c[cid].st) || 0; }
function cs(cid){ return S.c[cid] || (S.c[cid] = {st:0}); }
function raise(cid, v){ const c = cs(cid); if(c.st < v){ c.st = v; if(v === 3 && c.acq == null) c.acq = today(); } }
function theory(mid){ return MOD[mid].competences.filter(c => !c.pratique); }
function modPct(mid, X){ X = X || S; const cc = MOD[mid].competences; if(!cc.length) return 0; return cc.filter(c => ((X.c[c.id]||{}).st||0) >= 3).length / cc.length; }
function modAcquired(mid){ return MOD[mid] ? theory(mid).every(c => st(c.id) >= 3) : true; }
function canValidate(mid){
  const m = MOD[mid];
  if(m.prerequis && MOD[m.prerequis] && curP().modules.includes(m.prerequis) && !modAcquired(m.prerequis)) return {ok:false, why:`Valide d'abord « ${MOD[m.prerequis].titre} ».`};
  const tries = ((S.m[mid]||{}).tries||{})[today()] || 0;
  if(tries >= MAX_TRIES) return {ok:false, why:"3 tentatives aujourd'hui. Entraîne-toi sur tes erreurs et reviens demain."};
  return {ok:true, left:MAX_TRIES - tries};
}
function touch(){ const d = today(); if(!S.days.includes(d)) S.days.push(d); }
function streak(){
  const has = new Set(S.days); let d = today(); if(!has.has(d)) d--; let n = 0; const used = new Set(), wk = x => Math.floor((x+3)/7);
  while(true){ if(has.has(d)){ n++; d--; } else if(n > 0 && !used.has(wk(d)) && has.has(d-1)){ used.add(wk(d)); d--; } else break; }
  return n;
}
function leitner(qid, ok){ const r = S.q[qid] || {box:0, n:0, ok:0}; r.n++; if(ok){ r.ok++; r.box = Math.min(5, r.box + 1); } else r.box = 1; r.due = today() + INTERVALS[r.box - 1]; S.q[qid] = r; }
function reviewComp(cid, ok){
  const c = cs(cid); if(c.st < 3 || !COMP[cid] || COMP[cid].pratique) return;
  if(!ok){ c.rf = (c.rf||0) + 1; if(c.rf >= 2 && c.st === 4){ c.st = 3; c.rv = 0; c.rf = 0; c.lr = today(); } return; }
  c.rf = 0; const since = today() - (c.lr != null ? c.lr : c.acq), need = (c.rv||0) === 0 ? 6 : 13;
  if((c.rv||0) < 2 && since >= need){ c.rv = (c.rv||0) + 1; c.lr = today(); }
  if((c.rv||0) >= 2) c.st = 4;
}

function badgesList(){ return [
  {id:"first", name:"Premier pas", test:() => pMods().some(m => modAcquired(m.id) && theory(m.id).length)},
  {id:"streak7", name:"7 jours de suite", test:() => streak() >= 7},
  {id:"exam", name:"Épreuve blanche réussie", test:() => (S.exams||[]).some(e => e.good / e.n >= PASS)},
  ...pMods().map(m => ({id:"mod-"+m.id, name:m.badge, test:() => m.competences.length && m.competences.every(c => st(c.id) === 4)}))]; }
function checkBadges(){ const got = []; badgesList().forEach(b => { if(!S.badges.includes(b.id) && b.test()){ S.badges.push(b.id); got.push(b.name); } }); return got; }

/* ---------- sessions ---------- */
function start(mode, mid){
  let qs; const closed = q => q.type !== "ouverte";
  if(mode === "review") qs = dueList();
  else if(mode === "practice"){
    const all = DATA.questions.filter(q => q.module === mid);
    const pool = [...all.filter(closed), ...shuffle(all.filter(q => !closed(q))).slice(0, 2)];
    const weak = shuffle(pool.filter(q => S.q[q.id] && S.q[q.id].box <= 1));
    qs = [...new Set([...weak, ...shuffle(pool)].map(q => q.id))].slice(0, PRACTICE_N);
  } else if(mode === "exam"){
    const seen = pMods().filter(m => m.competences.some(c => st(c.id) >= 1)).map(m => m.id);
    const mods = seen.length >= 2 ? seen : pMods().map(m => m.id);
    const pool = DATA.questions.filter(q => closed(q) && mods.includes(q.module));
    const per = {}; shuffle(pool).forEach(q => (per[q.module] = per[q.module] || []).push(q.id));
    qs = []; let k = 0; const keys = shuffle(Object.keys(per));
    while(qs.length < EXAM_N && keys.some(m => per[m].length)){ const m = keys[k++ % keys.length]; if(per[m].length) qs.push(per[m].shift()); }
    qs = shuffle(qs);
  } else {
    const pool = DATA.questions.filter(q => q.module === mid && closed(q)); const pick = new Set();
    theory(mid).forEach(c => { const cand = shuffle(pool.filter(q => q.competence === c.id)); if(cand[0]) pick.add(cand[0].id); });
    pool.filter(q => q.critique).forEach(q => pick.add(q.id));
    shuffle(pool).forEach(q => { if(pick.size < VALID_N) pick.add(q.id); });
    qs = shuffle([...pick]);
    S.m[mid] = S.m[mid] || {}; const t = S.m[mid].tries = S.m[mid].tries || {}; t[today()] = (t[today()]||0) + 1;
  }
  if(!qs.length) return;
  if(mid){ theory(mid).forEach(c => raise(c.id, 1)); S.last = mid; }
  S.session = {mode, mid:mid||null, qs, i:0, res:[], done:false};
  if(mode === "exam") S.session.deadline = Date.now() + EXAM_MIN * 60000;
  prepQ(); save(); go("quiz");
}
function prepQ(){
  const s = S.session, q = QS[s.qs[s.i]]; s.done = false; s.pick = []; s.val = "";
  if(!q){ s.res.push({id:s.qs[s.i], ok:false, skip:true}); return; }
  if(q.type === "ordre"){ let o, n = 0; do{ o = shuffle(q.choix.map((_, i) => i)); } while(o.length > 1 && isOrderOk(q, o) && n++ < 20); s.cur = o; }
  if(q.type === "assoc"){ s.opts = shuffle([...new Set(q.paires.map(p => p[1]))]); s.cur = q.paires.map(() => ""); }
  if(q.type === "ouverte"){ s.stage = "write"; s.text = ""; s.tick = []; s.auto = []; }
  if(["qcm","vf","multi"].includes(q.type)) s.view = q.type === "vf" ? q.choix.map((_, i) => i) : shuffle(q.choix.map((_, i) => i));
}
function isOrderOk(q, o){ if(o.every((v, i) => v === i)) return true; return (q.echange||[]).some(([a, b]) => o.every((v, i) => v === (i === a ? b : i === b ? a : i))); }
function check(){
  const s = S.session, q = QS[s.qs[s.i]]; let ok = false;
  if(q.type === "qcm" || q.type === "vf") ok = s.pick.length === 1 && q.bonnes.includes(s.pick[0]);
  else if(q.type === "multi") ok = s.pick.length === q.bonnes.length && s.pick.every(x => q.bonnes.includes(x));
  else if(q.type === "ordre") ok = isOrderOk(q, s.cur);
  else if(q.type === "assoc") ok = q.paires.every((p, i) => s.cur[i] === p[1]);
  else if(q.type === "ouverte"){ ok = s.tick.length >= q.requis; S.open = S.open || []; S.open.unshift({id:q.id, day:today(), text:s.text, got:s.tick.length, tot:q.points.length, ok}); S.open = S.open.slice(0, 60); }
  else if(q.type === "calcul"){ const v = parseFloat(String(s.val).replace(/\s| /g, "").replace(",", ".")); ok = !isNaN(v) && Math.abs(v - q.reponse) <= (q.tolerance||0) + 1e-9; }
  s.res.push({id:q.id, ok}); leitner(q.id, ok); touch();
  if(s.mode === "review") reviewComp(q.competence, ok); else if(s.mode !== "exam") raise(q.competence, 1);
  if(s.mode === "exam"){ save(); next(); return; }
  s.done = true; s.ok = ok; save(); render();
}
function next(){ const s = S.session; s.i++; stopSpeak(); if(s.i >= s.qs.length){ finish(); return; } prepQ(); save(); render(); window.scrollTo(0, 0); }
function finish(){
  const s = S.session, n = s.qs.length, good = s.res.filter(r => r.ok).length, score = n ? good / n : 0;
  const out = {mode:s.mode, mid:s.mid, n, good, errs:s.res.filter(r => !r.ok && QS[r.id]).map(r => r.id)};
  if(s.mode === "practice") theory(s.mid).forEach(c => raise(c.id, score >= PRACTICE_OK ? 2 : 1));
  if(s.mode === "validation"){ const critOk = s.res.filter(r => QS[r.id] && QS[r.id].critique).every(r => r.ok);
    out.critOk = critOk; out.pass = score >= PASS && critOk; theory(s.mid).forEach(c => raise(c.id, out.pass ? 3 : 2)); }
  if(s.mode === "exam"){ const per = {}; s.qs.forEach(id => { const q = QS[id]; if(!q) return; const r = s.res.find(x => x.id === id);
      per[q.module] = per[q.module] || {n:0, good:0}; per[q.module].n++; if(r && r.ok) per[q.module].good++; });
    out.per = per; out.timeout = s.res.length < n; S.exams = (S.exams || []).concat([{day:today(), n, good}]).slice(-20); }
  out.badges = checkBadges(); S.session = null; S.lastResult = out; save(); go("result");
}

let speaking = null;
function canSpeak(){ return "speechSynthesis" in window; }
function stopSpeak(){ if(canSpeak()) speechSynthesis.cancel(); speaking = null; document.querySelectorAll(".speak[aria-pressed=true]").forEach(b => b.setAttribute("aria-pressed", "false")); }
function speak(key, text){
  if(!canSpeak()) return; if(speaking === key){ stopSpeak(); return; } stopSpeak();
  const u = new SpeechSynthesisUtterance(text.replace(/°C/g, " degrés").replace(/\s+/g, " ")); u.lang = "fr-FR"; u.rate = .95;
  const v = speechSynthesis.getVoices().find(v => /^fr/i.test(v.lang)); if(v) u.voice = v;
  u.onend = () => { if(speaking === key) stopSpeak(); }; speaking = key; speechSynthesis.speak(u);
  const b = document.querySelector(`.speak[data-v="${key}"]`); if(b) b.setAttribute("aria-pressed", "true");
}
const SPK = `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;

/* ---------- glossaire dans les fiches ---------- */
function linkGlossary(root){
  if(!GLOSS.length) return;
  const terms = GLOSS.map(g => g.terme).sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const re = new RegExp(`(^|[^\\p{L}])(${terms.join("|")})(?![\\p{L}])`, "iu");
  root.querySelectorAll(".secbody").forEach(sec => { const used = new Set();
    const walker = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest("button,figure,th,svg") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => { let n = node;
      while(n){ const m = re.exec(n.nodeValue); if(!m) break; const word = m[2], g = GLOSS.find(x => norm(x.terme) === norm(word));
        if(!g || used.has(g.terme)){ // éviter de relier deux fois : on coupe après ce mot
          const rest = n.splitText(m.index + m[0].length); n = rest; continue; }
        used.add(g.terme); const start = n.splitText(m.index + m[1].length), after = start.splitText(word.length);
        const b = document.createElement("button"); b.className = "gl"; b.dataset.act = "gloss"; b.dataset.v = g.terme; b.textContent = start.nodeValue; start.replaceWith(b); n = after; } }); });
}

/* ---------- composants ---------- */
function ring(v, size){
  size = size || 24; const r = size/2 - 2, c = size/2, frac = [0, .25, .5, 1, 1][v];
  const col = v >= 3 ? "var(--ok)" : v === 2 ? "var(--warn)" : "var(--muted)"; let pie = "";
  if(frac === 1) pie = `<circle cx="${c}" cy="${c}" r="${r}" fill="${col}"/>`;
  else if(frac > 0){ const a = 2*Math.PI*frac - Math.PI/2, x = c + r*Math.cos(a), y = c + r*Math.sin(a);
    pie = `<path d="M${c} ${c}L${c} ${c-r}A${r} ${r} 0 ${frac > .5 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z" fill="${col}"/>`; }
  const star = v === 4 ? `<path d="M${c} ${c-5}l1.5 3.2 3.4.4-2.5 2.3.7 3.4-3.1-1.7-3.1 1.7.7-3.4-2.5-2.3 3.4-.4z" fill="var(--surface)"/>` : "";
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${STATES[v]}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="2"/>${pie}${star}</svg>`;
}
function stateChip(v){ const k = v >= 3 ? "ok" : v === 2 ? "warn" : ""; return `<span class="chip ${k}">${ring(v, 16)}${STATES[v]}</span>`; }
function medal(on){ return `<svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><path d="M17 4h7l4 14h-7zM35 4h-7l-4 14h7z" fill="var(--accent)" opacity="${on?1:.5}"/><circle cx="26" cy="32" r="15" fill="${on?"var(--ok-tint)":"var(--sunk)"}" stroke="${on?"var(--ok)":"var(--line)"}" stroke-width="3"/><path d="M26 24l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="${on?"var(--ok)":"var(--line)"}"/></svg>`; }

const PL = {};

  return `<figure class="anim"><div class="stage" id="st-${id}"><svg viewBox="0 0 320 200" role="img" aria-label="${esc(A.label)}">${A.draw(p.t)}</svg></div>
   <figcaption id="cap-${id}" aria-live="polite">${esc(capAt(id, p.t))}</figcaption>
   <div class="ctrl"><button class="icon" data-act="aplay" data-v="${id}" id="pb-${id}" aria-label="Lecture">▶</button>
   <button class="icon" data-act="arestart" data-v="${id}" aria-label="Recommencer">↺</button><span class="bar" aria-hidden="true"><i id="bar-${id}" style="width:${(p.t / A.dur * 100).toFixed(1)}%"></i></span>
   <span class="small muted">${Math.round(A.dur / 1000)} s</span></div></figure>`;
}
function capAt(id, t){ let c = ""; ANIMS[id].caps.forEach(([t0, x]) => { if(t >= t0) c = x; }); return c; }
function paint(id){
  const A = ANIMS[id], p = PL[id], st = document.getElementById("st-" + id); if(!st) return;
  st.firstElementChild.innerHTML = A.draw(p.t);
  const cap = document.getElementById("cap-" + id), txt = capAt(id, p.t); if(cap.textContent !== txt) cap.textContent = txt;
  document.getElementById("bar-" + id).style.width = (p.t / A.dur * 100).toFixed(1) + "%";
  const b = document.getElementById("pb-" + id); b.textContent = p.on ? "❚❚" : "▶"; b.setAttribute("aria-label", p.on ? "Pause" : "Lecture");
}
let rafOn = false;
function loop(now){
  let any = false;
  Object.keys(PL).forEach(id => { const p = PL[id]; if(!p.on) return;
    if(!document.getElementById("st-" + id)){ p.on = false; return; }
    p.t = Math.min(ANIMS[id].dur, p.t + Math.min(100, now - p.last)); p.last = now;
    if(p.t >= ANIMS[id].dur) p.on = false; else any = true; paint(id); });
  rafOn = any; if(any) requestAnimationFrame(loop);
