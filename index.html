/* ---------- client Supabase minimal (sans bibliothèque externe) ---------- */
function makeSupabase(url, key){
  url = url.replace(/\/+$/, "");
  const SKEY = "labotechno-session";
  let session = null; const subs = [];
  try{ session = JSON.parse(localStorage.getItem(SKEY)); }catch(e){}
  const now = () => Math.floor(Date.now() / 1000);
  function store(s){
    session = s && s.access_token ? {access_token:s.access_token, refresh_token:s.refresh_token, expires_at:s.expires_at || now() + (+s.expires_in || 3600), user:s.user || (session && session.user) || null} : null;
    try{ if(session) localStorage.setItem(SKEY, JSON.stringify(session)); else localStorage.removeItem(SKEY); }catch(e){}
  }
  function emit(ev){ subs.forEach(cb => { try{ cb(ev, session); }catch(e){} }); }
  async function call(path, opt){
    let r; try{ r = await fetch(url + path, opt); }catch(e){ return {data:null, error:{message:"Pas de connexion au serveur (réseau)."}}; }
    const txt = await r.text(); let body = null; try{ body = txt ? JSON.parse(txt) : null; }catch(e){ body = txt; }
    if(!r.ok) return {data:null, error:{status:r.status, message:(body && (body.msg || body.message || body.error_description || body.error)) || ("Erreur " + r.status)}};
    return {data:body, error:null};
  }
  async function refresh(){
    if(!session || !session.refresh_token) return false;
    const {data, error} = await call("/auth/v1/token?grant_type=refresh_token", {method:"POST", headers:{apikey:key, "Content-Type":"application/json"}, body:JSON.stringify({refresh_token:session.refresh_token})});
    if(error){ if(error.status && error.status < 500){ store(null); emit("SIGNED_OUT"); } return false; }
    store(data); emit("TOKEN_REFRESHED"); return true;
  }
  async function fresh(){ if(session && session.expires_at && now() > session.expires_at - 60) await refresh(); }
  function headers(extra){ return Object.assign({apikey:key, "Content-Type":"application/json", Authorization:"Bearer " + (session ? session.access_token : key)}, extra || {}); }
  // Lien magique : les jetons arrivent dans l'adresse (#access_token=…)
  async function fromUrl(){
    const h = new URLSearchParams(location.hash.slice(1));
    if(h.get("error_description")){ const m = h.get("error_description"); history.replaceState(null, "", location.pathname + location.search); return m; }
    if(!h.get("access_token")) return null;
    store({access_token:h.get("access_token"), refresh_token:h.get("refresh_token"), expires_in:h.get("expires_in"), expires_at:+h.get("expires_at") || 0});
    history.replaceState(null, "", location.pathname + location.search);
    const {data} = await call("/auth/v1/user", {headers:headers()});
    if(data && data.id){ session.user = data; store(session); emit("SIGNED_IN"); } else store(null);
    return null;
  }
  const auth = {
    urlError:null,
    async init(){ auth.urlError = await fromUrl(); await fresh(); },
    async getSession(){ await fresh(); return {data:{session}}; },
    onAuthStateChange(cb){ subs.push(cb); return {data:{subscription:{unsubscribe(){ const i = subs.indexOf(cb); if(i >= 0) subs.splice(i, 1); }}}}; },
    async signInWithOtp({email, options}){
      const rt = options && options.emailRedirectTo ? "?redirect_to=" + encodeURIComponent(options.emailRedirectTo) : "";
      const {error} = await call("/auth/v1/otp" + rt, {method:"POST", headers:{apikey:key, "Content-Type":"application/json"}, body:JSON.stringify({email, create_user:true})});
      return {error};
    },
    async verifyOtp({email, token, type}){
      let res = await call("/auth/v1/verify", {method:"POST", headers:{apikey:key, "Content-Type":"application/json"}, body:JSON.stringify({type:type || "email", email, token})});
      if(res.error && (type || "email") === "email"){ // certains modèles envoient le code d'inscription
        const r2 = await call("/auth/v1/verify", {method:"POST", headers:{apikey:key, "Content-Type":"application/json"}, body:JSON.stringify({type:"signup", email, token})});
        if(!r2.error) res = r2; }
      if(res.error) return {data:null, error:res.error};
      store(res.data); emit("SIGNED_IN"); return {data:{session}, error:null};
    },
    async signOut(){ if(session) await call("/auth/v1/logout", {method:"POST", headers:headers()}); store(null); emit("SIGNED_OUT"); return {error:null}; }
  };
  function from(table){
    const st = {method:"GET", filters:[], order:null, body:null, ret:false, single:false, maybe:false, upsert:false, cols:"*"};
    const enc = v => encodeURIComponent(String(v));
    const run = async () => {
      await fresh();
      const q = [];
      if(st.method === "GET" || st.ret) q.push("select=" + enc(st.cols));
      st.filters.forEach(([k, op, v]) => q.push(k + "=" + (op === "eq" ? "eq." + enc(v) : "in.(" + v.map(x => '"' + String(x).replace(/"/g, '\\"') + '"').map(enc).join(",") + ")")));
      if(st.order) q.push("order=" + enc(st.order));
      const prefer = [];
      if(st.method !== "GET") prefer.push(st.ret ? "return=representation" : "return=minimal");
      if(st.upsert) prefer.push("resolution=merge-duplicates");
      const {data, error} = await call("/rest/v1/" + table + (q.length ? "?" + q.join("&") : ""), {method:st.method, headers:headers(prefer.length ? {Prefer:prefer.join(",")} : {}), body:st.body == null ? undefined : JSON.stringify(st.body)});
      if(error) return {data:null, error};
      const rows = Array.isArray(data) ? data : data == null ? [] : [data];
      if(st.single){ return rows.length === 1 ? {data:rows[0], error:null} : {data:null, error:{message:rows.length ? "Plusieurs lignes" : "Aucune ligne"}}; }
      if(st.maybe) return {data:rows[0] || null, error:null};
      return {data:st.method === "GET" || st.ret ? rows : null, error:null};
    };
    const b = {
      select(cols){ if(st.method === "GET") st.cols = cols || "*"; else { st.ret = true; st.cols = cols || "*"; } return b; },
      eq(k, v){ st.filters.push([k, "eq", v]); return b; },
      in(k, v){ st.filters.push([k, "in", v]); return b; },
      order(c, o){ st.order = c + (o && o.ascending === false ? ".desc" : ".asc"); return b; },
      single(){ st.single = true; return b; }, maybeSingle(){ st.maybe = true; return b; },
      insert(o){ st.method = "POST"; st.body = o; return b; },
      upsert(o){ st.method = "POST"; st.body = o; st.upsert = true; return b; },
      update(o){ st.method = "PATCH"; st.body = o; return b; },
      delete(){ st.method = "DELETE"; return b; },
      then(ok, ko){ return run().then(ok, ko); }
    };
    return b;
  }
  async function rpc(fn, args){ await fresh(); const {data, error} = await call("/rest/v1/rpc/" + fn, {method:"POST", headers:headers(), body:JSON.stringify(args || {})}); return {data, error}; }
  return {auth, from, rpc};
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  const a = b.dataset.act, v = b.dataset.v, s = S.session;
  if(a === "nav" || a === "go") go(v);
  else if(a === "mod") go("module", v);
  else if(a === "fiche") go("fiche", v);
  else if(a === "practice") start("practice", v);
  else if(a === "validate"){ if(canValidate(v).ok) start("validation", v); }
  else if(a === "review") start("review");
  else if(a === "exam"){ if(!S.session) start("exam"); }
  else if(a === "pick" && s && !s.done){ const i = +v, q = QS[s.qs[s.i]];
    if(q.type === "multi" || s.mode === "exam"){ s.pick = q.type === "multi" ? (s.pick.includes(i) ? s.pick.filter(x => x !== i) : [...s.pick, i]) : [i]; save(); render(); }
    else { s.pick = [i]; check(); } }
  else if(a === "up" || a === "down"){ const i = +v, j = a === "up" ? i - 1 : i + 1; [s.cur[i], s.cur[j]] = [s.cur[j], s.cur[i]]; save(); render();
    const f = document.querySelector(`[data-act="${a}"][data-v="${j}"]`); if(f && !f.disabled) f.focus(); }
  else if(a === "check") check();
  else if(a === "compare" && s){ const q = QS[s.qs[s.i]], t = norm(s.text); s.auto = q.points.map((p, i) => p.mots.some(m => m && t.includes(norm(m))) ? i : -1).filter(i => i >= 0); s.tick = s.auto.slice(); s.stage = "self"; save(); render(); }
  else if(a === "next") next();
  else if(a === "quit"){ if(s && s.mode === "exam"){ finish(); } else go("home"); }
  else if(a === "speak"){ const key = v; let txt = "";
    if(key.startsWith("q-")){ const el = document.getElementById("say-" + key); txt = el ? el.textContent : ""; }
    else if(key.startsWith("ess-")){ const m = MOD[key.slice(4)]; txt = "L'essentiel. " + m.fiche.essentiel.join(". "); }
    else { const el = document.getElementById(key); if(el){ const c = el.cloneNode(true); c.querySelectorAll("figure,button.speak").forEach(x => x.remove()); txt = (el.closest("details").querySelector("summary span:nth-child(2)") || {}).textContent + ". " + c.textContent; } }
    speak(key, txt); }
  else if(a === "gloss"){ gloss = v; render(); }
  else if(a === "glossclose"){ gloss = null; render(); }
  else if(a === "aplay") animToggle(v);
  else if(a === "arestart") animToggle(v, true);
  else if(a === "prat"){ const c = b.dataset.c, u = b.dataset.u;
    if(ONLINE && u){ setPratOnline(u, c, v); return; }
    if(v) S.prat[c] = v; else delete S.prat[c]; cs(c).st = v === "valide" ? 4 : v === "reprendre" ? 2 : 0; checkBadges(); save(); render(); }
  else if(a === "time"){ S.offset = +v === 0 ? 0 : (S.offset||0) + +v; save(); render(); }
  else if(a === "askreset"){ confirmReset = true; render(); }
  else if(a === "noreset"){ confirmReset = false; render(); }
  else if(a === "reset"){ S = fresh(); save(); formOk = false; confirmReset = false; go("onboard"); }
  else if(a === "delaccount"){ const {error} = await SB.rpc("supprimer_mon_compte"); if(error){ alertMsg("Suppression impossible : " + error.message); return; }
    try{ localStorage.removeItem(KEY); }catch(err){} await SB.auth.signOut(); USER = null; PROFILE = null; S = fresh(); confirmReset = false; loginState = {step:"email", email:"", err:"Ton compte et tes données ont été supprimés."}; go("login"); }
  else if(a === "logout"){ await pushNow(); await SB.auth.signOut(); USER = null; PROFILE = null; KEY = KEYBASE + ":local"; S = fresh(); G = {groups:[], cur:null, students:[], loaded:false, err:"", newCode:""}; loginState = {step:"email", email:"", err:""}; go("login"); }
  else if(a === "loginback"){ loginState.step = "email"; loginState.err = ""; saveLogin(); render(); }
  else if(a === "havecode"){ const em = document.getElementById("email"); if(em && em.value.trim()) loginState.email = em.value.trim(); loginState.step = "code"; loginState.err = ""; saveLogin(); render(); }
  else if(a === "resend"){ b.disabled = true; const {error} = await SB.auth.signInWithOtp({email:loginState.email, options:{emailRedirectTo:location.origin + location.pathname, shouldCreateUser:true}});
    loginState.err = error ? "Envoi impossible : " + traduire(error.message) : ""; if(!error) loginState.info = "Nouveau code envoyé."; render(); }
  else if(a === "lockprof"){ formOk = false; render(); }
  else if(a === "reloadcontent"){ b.disabled = true; b.textContent = "Chargement…"; await refreshContent(true); }
  else if(a === "selgroup"){ G.cur = v; G.newCode = ""; await loadStudents(); render(); }
  else if(a === "refreshgroup"){ await loadStudents(); render(); }
  else if(a === "eleve") go("eleve", v);
  else if(a === "whoami") go("account");
  else if(a === "setform"){ const v2 = (document.querySelector('input[name="pa"]:checked') || {}).value; if(!v2) return;
    S.profile.parcours = v2; save(); if(ONLINE && PROFILE){ await SB.from("profils").update({parcours:v2}).eq("id", USER.id); } go("home"); }
  else if(a === "copy"){ const t = document.getElementById("csv"), m = document.getElementById("copyMsg");
    const fall = () => { t.focus(); t.select(); m.textContent = "Texte sélectionné : copie-le avec le menu de ton téléphone."; };
    try{ navigator.clipboard.writeText(t.value).then(() => m.textContent = "Copié.", fall); }catch(err){ fall(); } }
  else if(a === "dlcsv"){ const t = document.getElementById("csv"), blob = new Blob(["﻿" + t.value], {type:"text/csv;charset=utf-8"}), u = URL.createObjectURL(blob);
    const l = document.createElement("a"); l.href = u; l.download = `suivi-${v}-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }
});
function alertMsg(t){ const m = document.createElement("p"); m.className = "notice"; m.textContent = t; document.getElementById("app").prepend(m); }
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.act === "tick" && S.session){ const i = +el.dataset.v, s = S.session; s.tick = el.checked ? [...new Set([...s.tick, i])] : s.tick.filter(x => x !== i); save(); return; }
  if(el.dataset.act !== "assoc" || !S.session) return;
  S.session.cur[+el.dataset.v] = el.value; save();
  const btn = document.getElementById("assocBtn"); if(btn) btn.disabled = !S.session.cur.every(Boolean);
});
document.addEventListener("input", e => {
  if(e.target.id === "calc" && S.session){ S.session.val = e.target.value; save(); }
  if(e.target.id === "openTa" && S.session){ S.session.text = e.target.value; save(); const b = document.getElementById("cmpBtn"); if(b) b.disabled = e.target.value.trim().length < 15; }
  if(e.target.id === "gq"){ view.arg = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("gq"); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  if(f.id === "onb"){ const p = document.getElementById("pseudo").value.trim(), code = document.getElementById("groupe").value.trim().toUpperCase(), err = document.getElementById("onbErr");
    const pf = (document.querySelector('input[name="pf"]:checked') || {}).value || FORMS[0].id;
    if(!p) return;
    if(ONLINE){
      let gp = null;
      if(code){ const {data:g} = await SB.from("groupes").select("code, parcours").eq("code", code).maybeSingle(); if(!g){ err.hidden = false; err.textContent = "Ce code de groupe n'existe pas. Vérifie-le avec ton formateur."; return; } gp = g.parcours; }
      const {data, error} = await SB.from("profils").insert({id:USER.id, pseudo:p, groupe_code:code || null, parcours:gp || pf}).select().single();
      if(error){ err.hidden = false; err.textContent = "Enregistrement impossible : " + error.message; return; }
      PROFILE = data; await pullAll(); go("home"); return; }
    S.profile = {pseudo:p, groupe:code, parcours:pf}; save(); go("home"); }
  if(f.id === "calcForm"){ if(!String(S.session.val).trim()){ document.getElementById("calc").focus(); return; } check(); }
  if(f.id === "pinForm"){ if(document.getElementById("pin").value === String(CONFIG.pinFormateur)){ formOk = true; render(); } else document.getElementById("pinErr").hidden = false; }
  if(f.id === "loginForm"){ const email = document.getElementById("email").value.trim().toLowerCase(); loginState.email = email;
    if(!/^\S+@\S+\.\S+$/.test(email)){ loginState.err = "Adresse e-mail invalide."; render(); return; }
    const btn = document.getElementById("sendBtn"); if(btn){ btn.disabled = true; btn.textContent = "Envoi en cours…"; }
    if(!SB){ loginState.err = "Le serveur n'est pas joignable. Vérifie ta connexion et recharge la page."; render(); return; }
    const {error} = await SB.auth.signInWithOtp({email, options:{emailRedirectTo:location.origin + location.pathname, shouldCreateUser:true}});
    if(error){ loginState.err = "Envoi impossible : " + traduire(error.message); render(); return; } loginState.step = "code"; loginState.err = ""; saveLogin(); render(); }
  if(f.id === "codeForm"){ loginState.info = ""; const token = document.getElementById("otp").value.replace(/\s/g, "");
    const {data, error} = await SB.auth.verifyOtp({email:loginState.email, token, type:"email"});
    if(error){ loginState.err = "Code incorrect ou expiré."; render(); return; } loginState.err = ""; try{ localStorage.removeItem(LKEY); }catch(e){} if(data && data.session && !USER) afterAuth(data.session); }
  if(f.id === "groupForm"){ const nom = document.getElementById("gname").value.trim(); if(!nom) return;
    const gpar = (document.querySelector('input[name="gf"]:checked') || {}).value || FORMS[0].id;
    let code = randCode(), tries = 0, res;
    do{ res = await SB.from("groupes").insert({code, nom, formateur_id:USER.id, parcours:gpar}).select().single(); if(res.error && /duplicate|unique/i.test(res.error.message)) code = randCode(); else break; } while(++tries < 5);
    if(res.error){ G.err = "Création impossible : " + res.error.message; render(); return; }
    G.newCode = code; G.cur = code; G.err = ""; await loadGroups(); }
});

/* ---------- démarrage ---------- */
(function bootApp(){
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){
    const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l);
    navigator.serviceWorker.register("sw.js").catch(() => {}); }
  if(CONFIG.sheetId) refreshContent(false);
  if(ONLINE) initOnline(); else { view = {name: S.profile ? "home" : "onboard"}; render(); }
})();

function traduire(m){ m = String(m || "");
  if(/rate limit|security purposes|seconds/i.test(m)) return "trop de demandes rapprochées. Attends une minute puis réessaie.";
  if(/smtp|sending|confirmation email|magic link email/i.test(m)) return "le service d'envoi d'e-mails n'est pas encore bien réglé (réglages SMTP dans Supabase).";
  if(/signups not allowed|not allowed/i.test(m)) return "la création de compte est désactivée dans Supabase (Authentication > Sign In / Providers).";
  if(/invalid email|email address/i.test(m)) return "adresse e-mail refusée.";
  return m; }
</script>
