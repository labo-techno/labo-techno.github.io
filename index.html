<style>
/* Layout : une colonne d'application (max 560 px), barre du haut collante, barre d'onglets en bas.
   Univers : inox du labo (gris acier froids) + bleu cobalt des gants et pansements alimentaires. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --sunk:#e3e9ee; --ink:#13202b; --muted:#4d5b68; --line:#cfd8e0;
  --accent:#1f4fd1; --accent-ink:#ffffff; --tint:#e4ebfc;
  --dough:#ecd3a4; --butter:#f2c94c; --steam:#9fc3f0; --golden:#d79a3a; --flour:#ffffff; --wood:#b07a45; --egg:#f7d978; --choco:#5b3a29;
  --ok:#17703f; --ok-tint:#dff1e6; --warn:#9a5600; --warn-tint:#fbeedb; --bad:#b0261c; --bad-tint:#fbe3e0;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#16202a; --sunk:#1c2834; --ink:#e9eff5; --muted:#a1afbc; --line:#2b3a48;
  --accent:#86a7ff; --accent-ink:#0a1222; --tint:#1a2a48;
  --dough:#b99662; --butter:#e6bb3c; --steam:#5f8fd0; --golden:#c4842a; --flour:#e9eef3; --wood:#94643a; --egg:#e6c65c; --choco:#8a5a3e;
  --ok:#66d396; --ok-tint:#14301f; --warn:#f2b866; --warn-tint:#352712; --bad:#ff8f86; --bad-tint:#3a1a18; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#16202a; --sunk:#1c2834; --ink:#e9eff5; --muted:#a1afbc; --line:#2b3a48;
  --accent:#86a7ff; --accent-ink:#0a1222; --tint:#1a2a48;
  --dough:#b99662; --butter:#e6bb3c; --steam:#5f8fd0; --golden:#c4842a; --flour:#e9eef3; --wood:#94643a; --egg:#e6c65c; --choco:#8a5a3e;
  --ok:#66d396; --ok-tint:#14301f; --warn:#f2b866; --warn-tint:#352712; --bad:#ff8f86; --bad-tint:#3a1a18; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.sim{margin-left:auto;font-size:13px;color:var(--warn);background:var(--warn-tint);padding:2px 8px;border-radius:99px;font-weight:700}
main .wrap{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:26px;font-weight:800;letter-spacing:-.015em}
h2{font-size:20px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.hero{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.card.hero .muted{color:inherit;opacity:.85}
.row{display:flex;align-items:center;gap:12px}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:17px;
  min-height:48px;padding:10px 18px;border-radius:10px;cursor:pointer;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.light{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible,.icon:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.big-num{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--ink)}
.chip.ok{background:var(--ok-tint);color:var(--ok)} .chip.warn{background:var(--warn-tint);color:var(--warn)} .chip.bad{background:var(--bad-tint);color:var(--bad)}
.chip.acc{background:var(--tint);color:var(--accent)}
/* carte du labo */
.labmap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.post{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:112px}
.post.lit{border-style:solid;border-color:var(--ok);background:var(--ok-tint)}
.post.started{border-style:solid;border-color:var(--line)}
.post .pname{font-family:var(--f-display);font-weight:600;font-size:16px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
/* compétences */
.comp{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.comp:first-child{border-top:0}
.comp .lbl{font-size:16px}
.ring{flex:none;margin-top:2px}
/* quiz */
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:99px;background:var(--sunk)}
.progress i.done{background:var(--accent)}
.progress i.ok{background:var(--ok)} .progress i.ko{background:var(--bad)}
.qtext{font-size:20px;font-weight:700;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;
  min-height:52px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.opt .mk{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-size:15px;font-weight:700}
.opt.round .mk{border-radius:50%}
.opt[aria-pressed="true"] .mk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ord{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.ord .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.ord .t{flex:1;min-width:0}
.icon{appearance:none;flex:none;width:44px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center}
.icon[disabled]{opacity:.3}
.assoc{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--surface);border:2px solid var(--line);border-radius:10px}
.assoc.right{border-color:var(--ok)} .assoc.wrong{border-color:var(--bad)}
select,input[type=text],input[type=password]{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;min-height:48px;padding:8px 10px;width:100%}
.calc{display:flex;gap:10px;align-items:center}
.calc input{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;max-width:220px}
.unit{font-weight:700;color:var(--muted)}
.feedback{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;border:2px solid}
.feedback.ok{background:var(--ok-tint);border-color:var(--ok)}
.feedback.ko{background:var(--bad-tint);border-color:var(--bad)}
.feedback .verdict{font-family:var(--f-display);font-weight:800;font-size:20px}
.feedback.ok .verdict{color:var(--ok)} .feedback.ko .verdict{color:var(--bad)}
.fiche p{margin:0 0 12px} .fiche p:last-child{margin:0}
.fiche b{font-weight:700}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;text-align:center;font-size:13px;font-weight:700}
.badge.off{opacity:.38}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;appearance:none;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:700;min-height:44px;padding:4px 6px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"].v{background:var(--ok);color:var(--surface)}
.seg button[aria-pressed="true"].r{background:var(--warn);color:var(--surface)}
.seg button[aria-pressed="true"].n{background:var(--sunk)}
textarea{width:100%;min-height:140px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex;gap:4px;padding-block:6px}
.tab{appearance:none;flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-height:52px;border-radius:8px;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent);background:var(--tint)}
.notice{font-size:14px;background:var(--warn-tint);color:var(--ink);border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px}
.lock{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.err-list{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:20px}
/* fiche */
.essentiel{background:var(--tint);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.essentiel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:18px;min-height:52px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:14px;font-family:var(--f-body);font-weight:700}
details.sec>summary .chev{margin-left:auto;transition:transform .15s}
details.sec[open]>summary .chev{transform:rotate(90deg)}
details.sec>summary .vid{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--accent);background:var(--tint);padding:2px 8px;border-radius:99px}
.secbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.secbody p,.secbody ol,.secbody ul{margin:0}
.secbody ol,.secbody ul{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl{border-collapse:collapse;width:100%;font-size:15px;line-height:1.4}
.tbl th{background:var(--sunk);text-align:left;font-weight:700;padding:8px 10px;white-space:nowrap}
.tbl th:empty{display:none}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;min-width:96px}
.tbl tr td:first-child{font-weight:700}
/* animations */
.anim{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.anim .stage{aspect-ratio:16/10;max-width:100%;display:block;background:var(--surface)}
.anim .stage svg{display:block;width:100%;height:100%}
.anim figcaption{padding:10px 12px;min-height:66px;font-size:16px;font-weight:700;border-top:1px solid var(--line);background:var(--surface)}
.anim .ctrl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.anim .ctrl .bar{flex:1}
.anim .ctrl .bar>i{background:var(--accent)}
.anim .ctrl .icon{width:44px;height:40px;font-size:16px}
/* question ouverte */
.open-ta{width:100%;min-height:150px;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.modele{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px}
.mine{background:var(--sunk);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:16px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.chk input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.chk .auto{display:block;font-size:13px;color:var(--ok);font-weight:700}
@media (prefers-reduced-motion: no-preference){ .fade{animation:fade .18s ease-out} @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}} }

/* ---------- ajouts v3 ---------- */
.top .who{margin-left:auto;display:flex;align-items:center;gap:8px}
.top .who .chip{cursor:pointer;border:0;font:inherit;font-size:14px;font-weight:700}
.sim{margin-left:0}
.qimg{width:100%;max-height:260px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}
.speak{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);font:inherit;font-size:14px;font-weight:700;border-radius:99px;padding:6px 12px;min-height:40px;cursor:pointer;align-self:flex-start}
.speak[aria-pressed="true"]{background:var(--tint);border-color:var(--accent)}
.gl{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:inherit;display:inline;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:3px;cursor:help}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -8px 24px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-block:16px;display:flex;flex-direction:column;gap:8px}
.glist{display:flex;flex-direction:column}
.glist .gi{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.glist .gi:first-child{border-top:0}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-family:var(--f-display)}
.timer.low{color:var(--bad)}
.heat{border-collapse:collapse;font-size:14px;width:100%}
.heat th,.heat td{padding:6px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.heat th:first-child,.heat td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700}
.heat thead th{background:var(--sunk);font-size:12px}
.heat td.c0{color:var(--muted)} .heat td.c1{background:var(--warn-tint)} .heat td.c2{background:var(--ok-tint)} .heat td.c3{background:var(--ok);color:var(--surface);font-weight:700}
.heat tr.click{cursor:pointer}
.err{color:var(--bad);font-size:14px}
.okmsg{color:var(--ok);font-size:14px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.code-in{letter-spacing:.3em;font-size:22px;font-weight:800;text-align:center}

.welcome h1{color:inherit}
.welcome p{color:inherit;opacity:.92}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.feat li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 44px;position:relative}
.feat li::before{content:"";position:absolute;left:14px;top:15px;width:18px;height:18px;border-radius:50%;background:var(--ok-tint);border:2px solid var(--ok)}
.feat li::after{content:"";position:absolute;left:20px;top:19px;width:5px;height:9px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
</style>

<script>const BUILTIN = {"version": "v4", "formations": [{"id": "CAP-PAT", "titre": "CAP Pâtissier", "metier": "Pâtisserie", "rncp": "RNCP38765", "modules": ["TC-HS", "PR-FEU", "PR-CHOUX", "PR-CREMES", "PR-BRISEE", "PR-LEVEE", "PR-BISCUITS", "PR-MERINGUES", "PR-CHOCO", "PR-ENTREMETS", "GE-COUTS", "TC-COMM"], "blocs": {"TC-HS": "BC01", "GE-COUTS": "BC02", "TC-COMM": "BC02"}}, {"id": "CAP-BOU", "titre": "CAP Boulanger", "metier": "Boulangerie", "rncp": "RNCP42115", "modules": ["TC-HS", "TC-COMM", "BO-MP", "BO-PANIF", "BO-PAINS", "PR-LEVEE", "BO-CALC", "GE-COUTS"], "blocs": {"TC-HS": "BC01", "TC-COMM": "BC01", "BO-MP": "BC01 / BC02", "PR-LEVEE": "BC02", "GE-COUTS": "BC02"}}, {"id": "CAP-CHT", "titre": "CAP Charcutier-traiteur", "metier": "Charcuterie-traiteur", "rncp": "RNCP38631", "modules": ["TC-HS", "CU-MP", "CU-SAL", "CU-FARCES", "CU-TRAIT", "CU-CUIS", "TC-COMM", "GE-COUTS"], "blocs": {"TC-HS": "BC02", "TC-COMM": "BC02", "GE-COUTS": "BC02"}}], "glossaire": [{"terme": "Abaisser", "definition": "Étaler une pâte au rouleau ou au laminoir à l'épaisseur voulue."}, {"terme": "Apprêt", "definition": "Fermentation des pièces de pâte levée après le façonnage, avant la cuisson."}, {"terme": "Bain-marie", "definition": "Récipient posé sur une casserole d'eau chaude, pour chauffer doucement."}, {"terme": "Beurre de tourage", "definition": "Beurre sec et plastique, enfermé dans la détrempe pour faire un feuilletage."}, {"terme": "Beurre noisette", "definition": "Beurre cuit jusqu'à couleur et odeur de noisette grillée."}, {"terme": "Beurre pommade", "definition": "Beurre ramolli à la consistance d'une pommade, sans être fondu."}, {"terme": "Blanchir", "definition": "Fouetter des jaunes avec du sucre jusqu'à ce que le mélange éclaircisse."}, {"terme": "Bouler", "definition": "Donner une forme de boule à une pâte."}, {"terme": "Chablonner", "definition": "Couvrir un fond d'une fine couche de chocolat ou de beurre de cacao pour l'isoler de l'humidité."}, {"terme": "Chemiser", "definition": "Garnir les parois d'un moule ou d'un cercle (rhodoïd, papier, pâte)."}, {"terme": "Chinoiser", "definition": "Passer une préparation au chinois (passoire fine)."}, {"terme": "Chiqueter", "definition": "Marquer le bord d'une pâte avec le dos d'un couteau pour aider le développement."}, {"terme": "Corser", "definition": "Trop travailler une pâte : elle devient élastique et se rétracte."}, {"terme": "Crémage", "definition": "Méthode : on mélange d'abord le beurre pommade et le sucre."}, {"terme": "Croûter", "definition": "Laisser sécher la surface (macarons) pour former une fine peau."}, {"terme": "Débarrasser", "definition": "Transvaser une préparation dans un autre récipient (plaque, bac)."}, {"terme": "Décercler", "definition": "Retirer le cercle d'un entremets ou d'une tarte."}, {"terme": "Dessécher", "definition": "Faire évaporer l'eau en trop en remuant sur le feu (panade)."}, {"terme": "Détente", "definition": "Court repos d'une pâte pour qu'elle se laisse façonner."}, {"terme": "Détrempe", "definition": "Mélange de farine, d'eau et de sel qui enveloppe le beurre de tourage."}, {"terme": "Dorer", "definition": "Badigeonner d'œuf battu pour colorer et faire briller à la cuisson."}, {"terme": "Ébarber", "definition": "Couper l'excédent de pâte au ras du moule."}, {"terme": "Émulsion", "definition": "Mélange stable de deux éléments qui ne se mélangent pas seuls (eau et matière grasse)."}, {"terme": "Ensemencement", "definition": "Tempérage en ajoutant du chocolat déjà tempéré au chocolat fondu."}, {"terme": "Fleurer", "definition": "Saupoudrer d'un voile de farine."}, {"terme": "Foisonner", "definition": "Incorporer de l'air en fouettant."}, {"terme": "Foncer", "definition": "Garnir un moule ou un cercle avec une abaisse de pâte."}, {"terme": "Fraser", "definition": "Écraser une pâte à la paume pour la rendre homogène."}, {"terme": "Imbiber", "definition": "Mouiller un biscuit avec un sirop pour le rendre moelleux."}, {"terme": "Insert", "definition": "Élément placé au cœur d'un entremets (crémeux, compotée…)."}, {"terme": "Macaronner", "definition": "Mélanger la pâte à macaron jusqu'à ce qu'elle coule en ruban brillant."}, {"terme": "Marche en avant", "definition": "Les produits avancent du sale vers le propre, sans retour en arrière."}, {"terme": "Nappe", "definition": "Stade de cuisson d'une crème anglaise (82-85 °C) : elle nappe la spatule."}, {"terme": "Panade", "definition": "Mélange cuit d'eau, de beurre et de farine, base de la pâte à choux."}, {"terme": "Pâton", "definition": "Bloc de pâte et de beurre en cours de tourage."}, {"terme": "PEPS", "definition": "Premier entré, premier sorti : on utilise d'abord les produits les plus anciens."}, {"terme": "Piquer", "definition": "Faire de petits trous dans une pâte pour qu'elle ne gonfle pas."}, {"terme": "Pointage", "definition": "Première fermentation d'une pâte levée, en masse."}, {"terme": "Rabat", "definition": "Dégazer une pâte levée en la repliant, pour lui redonner de la force."}, {"terme": "Rayer", "definition": "Faire un décor à la pointe du couteau sur une pâte dorée."}, {"terme": "Rhodoïd", "definition": "Bande de plastique alimentaire pour chemiser un cercle."}, {"terme": "Ruban", "definition": "Mélange fouetté qui coule et se plie sur lui-même : il est bien monté."}, {"terme": "Sablage", "definition": "Méthode : on frotte farine et beurre jusqu'à obtenir un sable."}, {"terme": "Tablage", "definition": "Tempérage en refroidissant une partie du chocolat sur un marbre."}, {"terme": "Tamiser", "definition": "Passer une poudre au tamis pour enlever les grumeaux."}, {"terme": "Tant pour tant", "definition": "Mélange de poudre d'amande et de sucre glace à poids égal."}, {"terme": "Tempérer", "definition": "Fondre, refroidir puis réchauffer le chocolat pour qu'il soit brillant et cassant."}, {"terme": "Tour simple", "definition": "Pli en 3 d'une pâte feuilletée : les couches sont multipliées par 3."}, {"terme": "Tour double", "definition": "Pli en 4 (portefeuille) : les couches sont multipliées par 4."}, {"terme": "DLC", "definition": "Date limite de consommation : « à consommer jusqu'au ». Dépassée, on écarte le produit."}, {"terme": "DDM", "definition": "Date de durabilité minimale : « de préférence avant ». Seule la qualité baisse."}, {"terme": "Coefficient multiplicateur", "definition": "Nombre par lequel on multiplie le coût matière pour obtenir le prix de vente HT."}, {"terme": "Rendement", "definition": "Part du poids brut qu'on garde après épluchage, équeutage ou cuisson."}, {"terme": "HACCP", "definition": "Méthode pour analyser les dangers et maîtriser les points critiques en alimentation."}, {"terme": "Frasage", "definition": "Premier temps du pétrissage : mélange lent des ingrédients."}, {"terme": "Autolyse", "definition": "Repos de la farine et de l'eau avant d'ajouter levure et sel ; la pâte devient plus extensible."}, {"terme": "Grigne", "definition": "Bord soulevé et doré formé par le coup de lame sur le pain."}, {"terme": "Lamage", "definition": "Incision de la pâte à la lame avant cuisson (scarification)."}, {"terme": "Buée", "definition": "Vapeur injectée dans le four à l'enfournement."}, {"terme": "Ressuage", "definition": "Refroidissement du pain sur grille ; il rejette sa vapeur."}, {"terme": "Levain", "definition": "Farine et eau fermentées par des levures sauvages et des bactéries lactiques."}, {"terme": "Rafraîchi", "definition": "Ajout de farine et d'eau pour nourrir et multiplier un levain."}, {"terme": "Poolish", "definition": "Pré-fermentation liquide : farine et eau à poids égal avec un peu de levure."}, {"terme": "Couche", "definition": "Toile de lin farinée où les baguettes font leur apprêt."}, {"terme": "Oura", "definition": "Ouverture du four qui laisse sortir la vapeur."}, {"terme": "Température de base", "definition": "Somme des températures (farine, fournil, eau…) qui donne la bonne température de pâte."}, {"terme": "Mêlée", "definition": "Mélange de viandes, gras, sel et épices d'une farce."}, {"terme": "Embosser", "definition": "Remplir un boyau avec une farce, au poussoir."}, {"terme": "Parer", "definition": "Retirer nerfs, cartilages et excès de gras d'une viande."}, {"terme": "Désosser", "definition": "Retirer les os d'une pièce de viande."}, {"terme": "Barder", "definition": "Envelopper une pièce d'une fine tranche de lard (barde)."}, {"terme": "Saumure", "definition": "Eau salée (souvent au sel nitrité) pour saler les viandes."}, {"terme": "Sel nitrité", "definition": "Sel contenant du nitrite de sodium : couleur rose et protection des salaisons. Dosage exact."}, {"terme": "Barattage", "definition": "Malaxage des viandes saumurées dans un tonneau pour répartir la saumure."}, {"terme": "Pocher", "definition": "Cuire dans un liquide frémissant, sans bouillir."}, {"terme": "Roux", "definition": "Beurre et farine cuits ensemble, pour épaissir une sauce."}, {"terme": "Cheminée", "definition": "Trou dans le couvercle d'un pâté en croûte pour la vapeur, puis pour couler la gelée."}, {"terme": "Appareil à crème prise", "definition": "Mélange d'œufs, de crème et de lait qui coagule à la cuisson (quiche)."}, {"terme": "Document unique", "definition": "Document qui liste les risques professionnels et les mesures de prévention."}], "parcours": "CAP Pâtissier (RNCP38765)", "modules": [{"id": "TC-HS", "titre": "Hygiène et HACCP de base", "court": "Hygiène", "poste": "Plonge et froid", "domaine": "Hygiène et sécurité (tronc commun)", "bloc": "BC01", "prerequis": "", "badge": "Gardien du froid", "fiche": {"duree": "10 min", "essentiel": ["3 familles de dangers : biologique, chimique, physique (+ les allergènes).", "Les bactéries se multiplient vite entre +10 °C et +63 °C.", "Refroidir une préparation cuite de +63 °C à +10 °C en moins de 2 heures.", "Nettoyer, puis désinfecter. Marche en avant : jamais de retour du sale vers le propre.", "À la réception : température, emballage, dates. DLC dépassée = produit écarté."], "sections": [{"t": "Les dangers", "anim": "", "md": "Un **danger** est tout ce qui peut rendre un client malade ou le blesser.\n\nFamille | Exemples au labo de pâtisserie\nBiologique | Bactéries (salmonelles des œufs, staphylocoques des mains et du nez, listeria des produits laitiers), virus, moisissures\nChimique | Reste de produit de nettoyage, désinfectant mal rincé, mauvais dosage d'un additif\nPhysique | Cheveu, bijou, éclat de verre, morceau de coquille, agrafe, bout de film\nAllergène | Gluten, œufs, lait, fruits à coque… non signalé au client\n\nPour trouver d'où vient un danger, on utilise la méthode des **5 M** : Matière (les produits), Main-d'œuvre (le personnel), Matériel, Milieu (les locaux), Méthode (la façon de travailler)."}, {"t": "Les microbes et la température", "anim": "thermo", "md": "Les bactéries ont besoin de **chaleur, de temps, d'eau et de nourriture** pour se multiplier. Les crèmes aux œufs et au lait leur offrent tout cela : ce sont des produits **sensibles**.\n\nTempérature | Ce qui se passe\nAu-dessus de +63 °C | Les bactéries ne se multiplient pas (maintien au chaud).\nEntre +10 et +63 °C | **Zone de danger** : multiplication rapide. On y passe le moins de temps possible.\nEntre 0 et +3 °C | Stockage des pâtisseries à la crème : la multiplication est très ralentie.\n−18 °C et moins | Surgelés : les bactéries ne se multiplient plus, mais ne sont pas tuées.\n\n**Refroidissement rapide :** une préparation cuite passe de +63 °C à +10 °C en **moins de 2 heures**, en cellule de refroidissement, en couche fine, filmée au contact.\n\n**Attention :** le froid ralentit les bactéries, il ne les tue pas. La cuisson (ébullition de la crème pâtissière, par exemple) en détruit une grande partie."}, {"t": "L'hygiène du personnel", "anim": "", "md": "**Tenue :** veste à manches longues, pantalon, tablier, calot ou charlotte qui couvre tous les cheveux, chaussures de sécurité antidérapantes. Tenue propre, réservée au labo.\n\n**Avant de commencer :** ongles courts sans vernis, pas de bijoux ni de montre, pas de téléphone au poste.\n\n**Lavage des mains :**\n\n1. Mouiller les mains et les poignets.\n2. Savonner avec le savon du poste (distributeur).\n3. Frotter au moins 30 secondes : paumes, dos, entre les doigts, ongles, poignets.\n4. Rincer.\n5. Sécher avec un essuie-mains à usage unique.\n6. Fermer le robinet sans les mains (commande au genou ou au pied, sinon avec l'essuie-mains).\n\n**Quand ?** En arrivant, après les toilettes, après s'être mouché, après avoir touché des déchets, des emballages, des œufs en coquille, et à chaque changement de tâche.\n\n**Santé :** une coupure se protège avec un pansement de couleur vive et un gant. On signale au responsable une diarrhée, de la fièvre ou une angine."}, {"t": "Nettoyage et désinfection", "anim": "", "md": "**Nettoyer** enlève les salissures visibles (détergent). **Désinfecter** détruit les micro-organismes (désinfectant). Un produit « détergent-désinfectant » fait les deux en une étape.\n\nL'efficacité dépend de 4 facteurs, le **TACT** : Température de l'eau, Action mécanique (frotter), Chimie (le bon produit, bien dosé), Temps d'action.\n\nLe **plan de nettoyage** affiché au labo dit : quoi, quand, comment, avec quel produit, et qui. On le suit et on le signe.\n\n**Protocole type d'un plan de travail :** retirer les déchets → nettoyer → rincer → désinfecter en respectant le temps d'action → rincer si le produit l'exige → laisser sécher."}, {"t": "La marche en avant", "anim": "", "md": "Les produits avancent toujours **du sale vers le propre** : réception → stockage → préparation → cuisson → refroidissement → stockage des produits finis → vente. Ils ne reviennent jamais en arrière.\n\nLes circuits propres et sales (déchets, vaisselle sale, emballages) ne se croisent pas. Quand les locaux ne le permettent pas, on sépare **dans le temps** : on travaille les produits sales, puis on nettoie et on désinfecte avant de passer aux produits propres.\n\nOn retire les cartons et emballages extérieurs avant d'entrer les produits dans les zones de stockage et de production."}, {"t": "Réception, stockage, traçabilité", "anim": "", "md": "**À la réception, on contrôle :** la température des produits frais et surgelés, l'emballage (intact, propre), les dates (DLC, DDM), l'étiquetage, l'aspect et l'odeur. Les résultats sont notés sur la fiche de réception. Un produit non conforme est refusé ou isolé et signalé.\n\n**DLC** « à consommer jusqu'au » : produit périssable, dépassée = on l'écarte. **DDM** « à consommer de préférence avant » : seule la qualité baisse.\n\n**Stockage :** on range tout de suite au froid, rien au sol, produits crus séparés des produits finis, tout est filmé ou couvert et étiqueté (nom, date de fabrication ou d'ouverture). On applique le **PEPS** : premier entré, premier sorti.\n\n**Traçabilité :** on garde les étiquettes et les numéros de lot. Si un fournisseur rappelle un lot, on sait dans quels produits il a été utilisé."}, {"t": "Les 14 allergènes", "anim": "", "md": "Il faut pouvoir informer le client sur les 14 allergènes réglementaires :\n\nAllergènes |\nCéréales contenant du gluten | Crustacés\nŒufs | Poissons\nArachides | Soja\nLait | Fruits à coque (amande, noisette…)\nCéleri | Moutarde\nGraines de sésame | Sulfites\nLupin | Mollusques\n\nEn pâtisserie, les plus fréquents sont le gluten, les œufs, le lait et les fruits à coque. Un ustensile mal nettoyé peut transférer un allergène d'une préparation à l'autre."}]}, "competences": [{"id": "HS-1", "libelle": "Appliquer les règles d'hygiène du personnel et des locaux", "pratique": false}, {"id": "HS-2", "libelle": "Expliquer les dangers et la marche en avant", "pratique": false}, {"id": "HS-3", "libelle": "Contrôler la réception et le stockage des produits", "pratique": false}], "video": ""}, {"id": "PR-FEU", "titre": "Les pâtes feuilletées", "court": "Feuilletage", "poste": "Tour", "domaine": "Procédés et techniques", "bloc": "BC01", "prerequis": "TC-HS", "badge": "Tourier", "fiche": {"duree": "10 min", "essentiel": ["Détrempe (farine, eau, sel) + beurre de tourage de même consistance.", "Tour simple = pli en 3 (× 3 couches). Tour double = pli en 4 (× 4).", "Classique : 6 tours simples, 2 par 2, repos au froid entre chaque série.", "Ça lève grâce à la vapeur d'eau, bloquée par les couches de beurre.", "Rétraction = gluten trop travaillé ou pas assez reposé."], "sections": [{"t": "Les ingrédients et leur rôle", "anim": "", "md": "Ingrédient | Rôle\nFarine de blé (souvent T45 ou T55, selon la recette) | Forme la détrempe. Son gluten donne une pâte souple qui s'étire en couches fines.\nEau froide | Hydrate la farine. À la cuisson, elle devient vapeur et fait lever.\nSel | Donne le goût et resserre le gluten.\nBeurre fondu (facultatif, dans la détrempe) | Assouplit la détrempe, la rend moins élastique.\nBeurre de tourage | Beurre « sec » et plastique : il s'étale en couche sans casser ni fondre. Il sépare les feuillets.\n\nOrdre de grandeur pédagogique : 500 g de farine, 250 g d'eau, 10 g de sel, 400 g de beurre de tourage (80 % du poids de farine). Suis toujours la fiche technique de ton centre."}, {"t": "Le procédé pas à pas", "anim": "", "md": "1. **Peser** tous les ingrédients.\n2. **Réaliser la détrempe :** mélanger farine, sel, eau (et beurre fondu) juste assez pour obtenir une pâte homogène. Ne pas la corser.\n3. **Bouler, inciser en croix**, filmer et laisser reposer au froid.\n4. **Préparer le beurre de tourage :** le taper ou l'abaisser en carré pour qu'il ait la même consistance que la détrempe.\n5. **Enfermer le beurre :** abaisser la détrempe en croix (ou en carré), poser le beurre au centre, refermer les bords sans laisser d'air.\n6. **Donner les tours :** abaisser en bande régulière, plier, tourner d'un quart de tour. 2 tours simples, puis repos au froid. Répéter 3 fois.\n7. **Marquer le pâton** avec le bout des doigts (1 empreinte par tour) pour ne pas oublier où on en est.\n8. **Abaisser et détailler** à l'épaisseur voulue, puis laisser reposer au froid avant cuisson.\n\nOn **fleure** légèrement (on saupoudre un voile de farine) et on brosse l'excès de farine avant chaque pli."}, {"t": "Le tourage : pourquoi tant de couches ?", "anim": "tourage", "md": "À chaque **tour simple**, la bande est pliée en 3 : le nombre de couches de beurre est multiplié par 3. À chaque **tour double** (en portefeuille), il est multiplié par 4.\n\nTours simples donnés | 1 | 2 | 3 | 4 | 5 | 6\nCouches de beurre | 3 | 9 | 27 | 81 | 243 | 729\n\nAvec 4 tours doubles : 4 × 4 × 4 × 4 = 256 couches. Trop de tours rend les couches si fines qu'elles se mélangent : le feuilletage lève moins.\n\n**Le repos au froid** (entre chaque série de 2 tours) détend le gluten et raffermit le beurre. Sans repos, la pâte se rétracte et le beurre perce."}, {"t": "Pourquoi le feuilletage lève", "anim": "levee", "md": "Il n'y a pas de levure. Au four chaud, l'eau contenue dans la détrempe et dans le beurre se transforme en **vapeur**. Les couches de beurre empêchent cette vapeur de s'échapper : elle **soulève chaque feuillet**. Puis la pâte cuit et se fige.\n\nC'est pour cela qu'on enfourne à **four chaud** (environ 200 à 220 °C selon le four et le produit), puis qu'on baisse si besoin pour bien cuire à cœur. Un feuilletage pas assez cuit est pâteux et retombe."}, {"t": "Les trois méthodes", "anim": "", "md": "Méthode | Principe | À retenir\nClassique | Le beurre est enfermé dans la détrempe | La référence pour la plupart des produits\nInversé | Le beurre manié (beurre + farine) enveloppe la détrempe | Très friable, se rétracte peu ; idéal pour le mille-feuille\nRapide | Le beurre en dés est mélangé directement à la pâte, puis on donne les tours | Plus rapide, développement moins régulier"}, {"t": "Défauts : causes et remèdes", "anim": "", "md": "Défaut | Causes probables | Remède\nLa pâte rétrécit à la cuisson | Détrempe corsée (trop pétrie), repos insuffisants | Mélanger juste ce qu'il faut, respecter les repos, faire reposer les pièces détaillées\nLe beurre perce pendant le tourage | Beurre et détrempe de consistances différentes (beurre trop dur ou trop mou) | Amener les deux à la même fermeté\nLe feuilletage lève peu | Beurre trop mou ou fondu, trop de tours, four pas assez chaud | Travailler au frais, compter les tours, préchauffer le four\nDéveloppement de travers | Abaisse d'épaisseur irrégulière, dorure coulée sur les bords, découpe qui écrase | Abaisser régulièrement, dorer le dessus seulement, découper net\nLe beurre coule à la cuisson, pâte grasse | Beurre ramolli pendant le tourage, four pas assez chaud | Repos au froid, four bien chaud à l'enfournement"}, {"t": "Vocabulaire du tourier", "anim": "", "md": "Terme | Signification\nAbaisser | Étaler la pâte au rouleau ou au laminoir\nPâton | Bloc de pâte et de beurre en cours de tourage\nFleurer | Saupoudrer d'un voile de farine\nDétailler | Découper les pièces dans l'abaisse\nChiqueter | Marquer le bord avec le dos d'un couteau pour aider le développement\nRayer | Faire un décor à la pointe du couteau sur la dorure\nPiquer | Faire des petits trous pour empêcher la pâte de gonfler (fond de mille-feuille)\nDorer | Badigeonner d'œuf battu pour colorer et faire briller"}, {"t": "Produits, hygiène et allergènes", "anim": "", "md": "**Produits :** mille-feuille, galette des rois et pithiviers (crème d'amande ou frangipane), chausson aux pommes, palmier, allumette (glace royale), bouchée et vol-au-vent, sacristain.\n\n**Hygiène :** beurre et pâtons sont stockés au froid positif, filmés et étiquetés. Les produits garnis de crème se conservent entre 0 et +3 °C.\n\n**Allergènes :** gluten (blé) et lait (beurre). Ajouter les œufs si on dore à l'œuf, et les fruits à coque pour une garniture amande."}]}, "competences": [{"id": "FEU-1", "libelle": "Citer les composants de la détrempe et du beurre de tourage", "pratique": false}, {"id": "FEU-2", "libelle": "Expliquer comment le feuilletage lève", "pratique": false}, {"id": "FEU-3", "libelle": "Ordonner les étapes d'un feuilletage classique", "pratique": false}, {"id": "FEU-4", "libelle": "Calculer le nombre de couches selon les tours", "pratique": false}, {"id": "FEU-5", "libelle": "Adapter une recette à une quantité demandée", "pratique": false}, {"id": "FEU-6", "libelle": "Diagnostiquer un défaut et proposer un remède", "pratique": false}, {"id": "FEU-7", "libelle": "Identifier les allergènes d'un feuilletage", "pratique": false}, {"id": "FEU-8", "libelle": "Réaliser un feuilletage classique à 6 tours simples", "pratique": true}], "video": ""}, {"id": "PR-CHOUX", "titre": "La pâte à choux", "court": "Choux", "poste": "Four", "domaine": "Procédés et techniques", "bloc": "BC01", "prerequis": "TC-HS", "badge": "Main de choux", "fiche": {"duree": "8 min", "essentiel": ["Une pâte cuite deux fois : la panade dans la casserole, puis au four.", "Le dessèchement évapore l'eau : la panade absorbe plus d'œufs.", "Bonne consistance : un sillon tracé se referme lentement.", "Le chou gonfle grâce à la vapeur ; les œufs forment la structure.", "On n'ouvre pas le four avant que les choux soient secs et dorés."], "sections": [{"t": "Les ingrédients et leur rôle", "anim": "", "md": "Ingrédient | Quantité repère | Rôle\nEau (ou moitié lait) | 250 g | Fournit la vapeur. Le lait donne plus de couleur et de goût.\nBeurre | 100 g | Goût, moelleux\nSel | 5 g | Goût\nSucre | 5 g | Goût, coloration\nFarine tamisée | 150 g | Son amidon cuit et épaissit : c'est la panade\nŒufs | 250 g (environ 5) | Rendent la pâte élastique ; en cuisant, ils coagulent et fixent la forme\n\nTotal : 760 g de pâte. Les œufs se pèsent toujours : leur taille varie."}, {"t": "Le procédé pas à pas", "anim": "choux", "md": "1. Porter l'eau, le beurre, le sel et le sucre à **ébullition** (le beurre doit être fondu).\n2. **Hors du feu**, verser toute la farine tamisée d'un coup et mélanger vivement à la spatule.\n3. **Dessécher** sur le feu en remuant 1 à 2 minutes : la pâte forme une boule, se décolle des bords et laisse un léger film au fond.\n4. Débarrasser dans la cuve du batteur (ou un cul-de-poule) et laisser tiédir quelques instants.\n5. Incorporer les **œufs petit à petit**, en attendant que chaque ajout soit absorbé. Garder le dernier œuf battu à part pour ajuster.\n6. **Contrôler la consistance :** la pâte est lisse et brillante ; un sillon tracé se referme lentement, et la pâte forme un bec souple au bout de la spatule.\n7. **Dresser** à la poche (douille unie ou cannelée) sur plaque, en pièces régulières. Dorer et aplatir les pointes avec une fourchette.\n8. **Cuire** dans un four préchauffé (environ 180 à 200 °C selon le four), sans ouvrir la porte pendant le développement, jusqu'à ce que les choux soient secs et dorés."}, {"t": "Ce qui se passe dans le four", "anim": "", "md": "L'eau de la pâte se transforme en **vapeur**. La pâte, rendue élastique par les œufs, retient cette vapeur et **gonfle**. Puis les protéines des œufs coagulent et l'amidon finit de cuire : le chou se fige, creux à l'intérieur.\n\nSi on ouvre la porte trop tôt, la vapeur s'échappe et la pâte n'est pas encore figée : le chou **retombe**. S'il n'est pas assez cuit, l'intérieur reste humide et il s'affaisse en refroidissant."}, {"t": "Défauts : causes et remèdes", "anim": "", "md": "Défaut | Causes probables | Remède\nChoux plats, étalés | Pâte trop molle : trop d'œufs, panade pas assez desséchée | Dessécher davantage, ajouter le dernier œuf avec prudence\nChoux peu développés, fendus de façon irrégulière | Pâte trop ferme (pas assez d'œufs), four trop chaud | Ajuster les œufs, régler le four\nChoux retombés | Four ouvert trop tôt, choux pas assez cuits | Ne pas ouvrir pendant le développement, cuire jusqu'à ce qu'ils soient secs\nIntérieur humide, pâteux | Cuisson trop courte | Prolonger la cuisson, finir porte entrouverte si le four le permet\nFormes irrégulières | Dressage irrégulier, poche mal tenue | Utiliser un gabarit, tenir la poche bien droite"}, {"t": "Produits, conservation, allergènes", "anim": "", "md": "**Produits :** éclair (glacé au fondant), religieuse (collerette de crème au beurre), Paris-Brest (crème mousseline pralinée, amandes), chouquette (sucre en grains), Saint-Honoré (choux caramélisés, crème chiboust ou chantilly), profiteroles, gougères (version salée au fromage).\n\n**Conservation :** les choux cuits vides se congèlent bien. Une fois garnis de crème, ils se conservent entre 0 et +3 °C et se consomment rapidement, selon le plan de maîtrise sanitaire du labo.\n\n**Allergènes :** gluten, œufs, lait (beurre, lait). Ajouter fruits à coque pour un Paris-Brest."}]}, "competences": [{"id": "CH-1", "libelle": "Expliquer le rôle des ingrédients et du dessèchement", "pratique": false}, {"id": "CH-2", "libelle": "Ordonner les étapes de la pâte à choux", "pratique": false}, {"id": "CH-3", "libelle": "Juger la consistance et diagnostiquer un défaut", "pratique": false}, {"id": "CH-4", "libelle": "Calculer les quantités d'une recette", "pratique": false}, {"id": "CH-5", "libelle": "Reconnaître les produits à base de pâte à choux", "pratique": false}, {"id": "CH-6", "libelle": "Réaliser et dresser une pâte à choux régulière", "pratique": true}], "video": ""}, {"id": "PR-CREMES", "titre": "Les crèmes de base", "court": "Crèmes", "poste": "Crèmes", "domaine": "Procédés et techniques", "bloc": "BC01 / BC02", "prerequis": "TC-HS", "badge": "Chef de partie crèmes", "fiche": {"duree": "10 min", "essentiel": ["Crème pâtissière : on la fait bouillir 1 à 2 minutes pour cuire l'amidon.", "Crème anglaise : cuite à la nappe, entre 82 et 85 °C, sans bouillir.", "Chantilly : crème bien froide, au moins 30 % de matière grasse.", "Crèmes dérivées = crème de base + un élément (chantilly, beurre, meringue…).", "Refroidir de +63 °C à +10 °C en moins de 2 h, stocker entre 0 et +3 °C."], "sections": [{"t": "Les crèmes de base", "anim": "", "md": "Crème | Ingrédients | Technique | Utilisations\nPâtissière | Lait, jaunes (ou œufs), sucre, poudre à crème ou farine, (beurre) | Cuite jusqu'à ébullition, 1 à 2 min | Choux, éclairs, mille-feuille, tartes\nAnglaise | Lait, jaunes, sucre, vanille | Cuite à la nappe, 82 à 85 °C, sans bouillir | Sauce, base de bavarois et de glace\nChantilly | Crème liquide (30 % MG minimum), sucre glace, vanille | Montée bien froide | Garniture, décor\nCrème d'amande | Beurre, sucre, poudre d'amande, œufs (poids égaux) | Crémée, sans trop d'air, cuite dans le produit | Galette, pithiviers, tartes amandines\nCrème au beurre | Beurre + pâte à bombe, meringue italienne ou crème anglaise | Émulsion foisonnée | Moka, religieuse, décor"}, {"t": "Crème pâtissière pas à pas", "anim": "", "md": "1. Faire bouillir le lait (avec la vanille).\n2. **Blanchir** les jaunes avec le sucre (fouetter jusqu'à ce que le mélange éclaircisse).\n3. Ajouter la poudre à crème et mélanger sans faire de grumeaux.\n4. Verser une partie du lait chaud sur le mélange pour le **détendre**, puis reverser le tout dans la casserole.\n5. **Cuire** en fouettant sans arrêt jusqu'à ébullition, puis laisser bouillir 1 à 2 minutes.\n6. Ajouter le beurre hors du feu (si la recette en prévoit).\n7. **Débarrasser** sur une plaque propre et désinfectée, en couche fine, **filmer au contact** (pas de croûte, pas d'air).\n8. **Refroidir** aussitôt en cellule, puis stocker entre 0 et +3 °C.\n\nPour l'utiliser, on la lisse au fouet ou au batteur."}, {"t": "Crème anglaise : la cuisson à la nappe", "anim": "anglaise", "md": "On cuit la crème anglaise **sans la faire bouillir**, en remuant à la spatule en « 8 ». Elle est cuite « à la nappe » entre **82 et 85 °C** : elle nappe la spatule et le doigt y laisse une trace nette.\n\nAu-delà, les protéines des jaunes coagulent trop : la crème **tourne** (grains). On la chinoise et on la refroidit immédiatement. Un léger début de grains peut se rattraper au mixeur plongeant."}, {"t": "Les sciences derrière les crèmes", "anim": "", "md": "Phénomène | Ce qui se passe | Dans quelle crème\nGélatinisation de l'amidon | Chauffé avec de l'eau, l'amidon gonfle et épaissit. Il doit bouillir pour bien cuire. | Pâtissière\nCoagulation des protéines | Les protéines de l'œuf se figent à la chaleur : elles épaississent, ou forment des grains si on chauffe trop. | Anglaise, pâtissière\nFoisonnement | Le fouet fait entrer de l'air ; la matière grasse froide l'emprisonne. | Chantilly, crème au beurre\nÉmulsion | Deux éléments qui ne se mélangent pas (eau et matière grasse) sont dispersés l'un dans l'autre. | Crème au beurre, mousseline"}, {"t": "Les crèmes dérivées", "anim": "", "md": "Crème | Composition\nDiplomate | Pâtissière + chantilly (+ gélatine)\nMousseline | Pâtissière + beurre\nChiboust | Pâtissière + meringue italienne (+ gélatine)\nFrangipane | Crème d'amande + pâtissière\nBavaroise | Anglaise + gélatine + crème fouettée"}, {"t": "Défauts : causes et remèdes", "anim": "", "md": "Défaut | Causes probables | Remède\nPâtissière grumeleuse | Poudre mal délayée, pas assez fouettée pendant la cuisson | Bien mélanger, fouetter sans arrêt ; lisser au mixeur\nPâtissière au goût de farine, qui relâche | Pas assez cuite | Laisser bouillir 1 à 2 minutes\nCroûte sur la pâtissière | Pas filmée au contact | Filmer au contact dès la sortie du feu\nAnglaise tournée (grains) | Trop chauffée, au-delà de 85 °C | Contrôler au thermomètre, refroidir aussitôt\nChantilly qui ne monte pas | Crème trop chaude ou pas assez grasse | Crème et cuve bien froides, 30 % MG minimum\nChantilly granuleuse (début de beurre) | Fouettée trop longtemps | Arrêter dès qu'elle tient au fouet"}, {"t": "Hygiène des crèmes", "anim": "", "md": "Les crèmes aux œufs et au lait sont parmi les produits les plus **sensibles** du labo.\n\n- Matériel propre et désinfecté, mains lavées, travail rapide.\n- Refroidissement de +63 °C à +10 °C en **moins de 2 heures**, en cellule.\n- Stockage entre **0 et +3 °C**, filmé, étiqueté (nom, date et heure de fabrication).\n- Durée d'utilisation : celle fixée par le plan de maîtrise sanitaire du labo.\n- Chantilly : on ne sort que la quantité nécessaire ; elle ne reste pas à température ambiante.\n\n**Allergènes :** lait et œufs dans presque toutes les crèmes ; gluten si on utilise de la farine ; fruits à coque dans la crème d'amande et la frangipane."}]}, "competences": [{"id": "CR-1", "libelle": "Ordonner la fabrication d'une crème pâtissière", "pratique": false}, {"id": "CR-2", "libelle": "Expliquer la cuisson des crèmes (amidon, coagulation)", "pratique": false}, {"id": "CR-3", "libelle": "Distinguer les crèmes de base et dérivées", "pratique": false}, {"id": "CR-4", "libelle": "Calculer les quantités de crème", "pratique": false}, {"id": "CR-5", "libelle": "Appliquer les règles d'hygiène propres aux crèmes", "pratique": false}, {"id": "CR-6", "libelle": "Réaliser une crème pâtissière lisse et refroidie à cœur", "pratique": true}], "video": ""}, {"id": "PR-BRISEE", "titre": "Pâtes brisées, sablées, sucrées", "court": "Pâtes à foncer", "poste": "Tour", "domaine": "Procédés et techniques", "bloc": "BC01", "prerequis": "TC-HS", "badge": "Foncer sans rétrécir", "competences": [{"id": "BR-1", "libelle": "Distinguer pâte brisée, sucrée et sablée", "pratique": false}, {"id": "BR-2", "libelle": "Expliquer sablage et crémage", "pratique": false}, {"id": "BR-3", "libelle": "Ordonner le fonçage et la cuisson à blanc", "pratique": false}, {"id": "BR-4", "libelle": "Diagnostiquer un défaut de fond de tarte", "pratique": false}, {"id": "BR-5", "libelle": "Calculer une recette de pâte", "pratique": false}, {"id": "BR-6", "libelle": "Foncer un cercle et cuire un fond régulier", "pratique": true}], "fiche": {"duree": "8 min", "essentiel": ["Brisée : peu ou pas de sucre, pour tartes et quiches. Sucrée et sablée : plus de sucre et de beurre.", "Sablage : on frotte farine et beurre d'abord. Crémage : on mélange beurre et sucre d'abord.", "Repos au froid avant d'abaisser : moins d'élasticité, moins de rétraction.", "Piquer le fond, cuire à blanc avec des poids si la garniture ne cuit pas.", "Fond détrempé : cuire à blanc ou chablonner (fine couche de chocolat ou beurre de cacao)."], "sections": [{"t": "Les trois pâtes", "md": "Pâte | Composition repère | Texture | Utilisations\nBrisée | Farine, beurre, sel, eau (parfois un jaune) | Ferme, peu friable | Tartes aux fruits cuits, quiches, tourtes\nSucrée | Farine, beurre, sucre glace, œuf, parfois poudre d'amande | Fine, croquante | Fonds de tartes fines (citron, fraises)\nSablée | Beaucoup de beurre et de sucre, farine | Très friable | Sablés, fonds friables, sablé breton\n\nRepère de la pâte sablée « 1-2-3 » : 100 g de sucre, 200 g de beurre, 300 g de farine (+ un œuf ou des jaunes). Suis la fiche technique de ton centre.", "anim": ""}, {"t": "Sablage ou crémage", "md": "**Sablage :** on frotte la farine et le beurre froid en dés entre les mains jusqu'à obtenir un « sable ». Puis on ajoute les liquides. Le beurre enrobe la farine : le gluten se développe peu, la pâte est friable.\n\n**Crémage :** on mélange le beurre pommade et le sucre, puis les œufs, puis la farine. Pâte plus lisse, idéale pour la pâte sucrée.\n\n**Fraser :** on écrase la pâte avec la paume, par petites quantités, pour la rendre homogène. On frase une ou deux fois seulement : trop travaillée, la pâte devient élastique (corsée).", "anim": ""}, {"t": "Fonçage et cuisson à blanc", "md": "1. Laisser reposer la pâte au froid, filmée.\n2. Abaisser à épaisseur régulière (environ 2 à 3 mm), en fleurant légèrement.\n3. Foncer : poser l'abaisse dans le cercle beurré, la faire descendre dans les angles sans l'étirer.\n4. Ébarber : couper l'excédent au ras du cercle.\n5. Piquer le fond à la fourchette ou au pique-vite.\n6. Laisser reposer au froid avant cuisson.\n7. Cuire à blanc si besoin : papier cuisson + poids ou billes de cuisson, puis finir sans poids pour dorer.\n\nOn cuit à blanc quand la garniture ne cuit pas (tarte aux fraises, au citron) ou cuit peu. Pour protéger un fond de l'humidité, on le **chablonne** : fine couche de chocolat ou de beurre de cacao.", "anim": ""}, {"t": "Défauts : causes et remèdes", "md": "Défaut | Causes probables | Remède\nLe fond rétrécit à la cuisson | Pâte corsée, pas assez de repos, abaisse étirée en fonçant | Fraser peu, reposer au froid, foncer sans tirer\nLa pâte casse à l'abaisse | Pâte trop froide ou trop sèche | La laisser tempérer quelques minutes, la fraser légèrement\nLe fond gonfle | Fond non piqué, pas de poids en cuisson à blanc | Piquer, cuire avec poids\nLe fond est détrempé | Garniture humide, fond pas assez cuit | Cuire à blanc, chablonner\nLa pâte colle au plan | Pâte trop chaude, trop de beurre fondu | Travailler au froid, fleurer légèrement", "anim": ""}, {"t": "Hygiène et allergènes", "md": "Pâtes crues filmées et étiquetées au froid positif, ou congelées. Les tartes garnies de crème se conservent entre 0 et +3 °C.\n\nAllergènes : gluten, lait (beurre), œufs (pâte sucrée, sablée, brisée au jaune), fruits à coque si poudre d'amande.", "anim": ""}]}, "video": ""}, {"id": "PR-LEVEE", "titre": "Pâtes levées et levées feuilletées", "court": "Viennoiserie", "poste": "Pousse", "domaine": "Procédés et techniques", "bloc": "BC01", "prerequis": "TC-HS", "badge": "Maître de la pousse", "competences": [{"id": "LV-1", "libelle": "Expliquer la fermentation et le rôle de la levure", "pratique": false}, {"id": "LV-2", "libelle": "Ordonner les étapes d'une pâte levée", "pratique": false}, {"id": "LV-3", "libelle": "Expliquer le tourage d'une pâte levée feuilletée", "pratique": false}, {"id": "LV-4", "libelle": "Diagnostiquer un défaut de pousse ou de cuisson", "pratique": false}, {"id": "LV-5", "libelle": "Calculer les quantités d'une pâte levée", "pratique": false}, {"id": "LV-6", "libelle": "Façonner des croissants réguliers", "pratique": true}], "fiche": {"duree": "10 min", "essentiel": ["La levure transforme les sucres en gaz carbonique et en alcool : c'est la fermentation.", "Le gaz est retenu par le réseau de gluten formé au pétrissage : la pâte gonfle.", "Pointage = 1re fermentation en masse ; apprêt = fermentation des pièces façonnées.", "Croissant : détrempe levée + beurre de tourage ; apprêt pas trop chaud pour ne pas fondre le beurre.", "Ne pas mettre le sel en contact direct avec la levure."], "sections": [{"t": "La levure et la fermentation", "md": "La **levure de boulanger** est un champignon microscopique vivant. Avec de l'humidité et une température douce, elle transforme les sucres de la pâte en **gaz carbonique** (CO₂) et en **alcool** : c'est la fermentation alcoolique.\n\nLe gaz est retenu par le **réseau de gluten** formé au pétrissage : la pâte gonfle. L'alcool et d'autres produits de fermentation donnent du goût.\n\n- Le froid ralentit la levure (pointage retardé au réfrigérateur).\n- La chaleur l'active, mais une chaleur trop forte la tue (vers 55 à 60 °C).\n- Le sel en contact direct freine la levure : on les met de part et d'autre dans la cuve.", "anim": ""}, {"t": "Les étapes d'une pâte levée", "md": "1. **Pétrissage :** mélanger puis développer le gluten. La pâte devient lisse et élastique (test de la fenêtre : elle s'étire en voile fin sans se déchirer).\n2. **Pointage :** première fermentation de la pâte en masse, couverte.\n3. **Rabat ou dégazage :** on chasse une partie du gaz et on redonne de la force.\n4. **Division et boulage :** peser les pièces, les mettre en boule.\n5. **Détente :** court repos pour que la pâte se laisse façonner.\n6. **Façonnage :** donner la forme (brioche à tête, Nanterre, tresse…).\n7. **Apprêt :** fermentation des pièces façonnées, à l'abri des courants d'air.\n8. **Dorure et cuisson.**\n\nBrioche : pâte riche en œufs et en beurre. Le beurre s'ajoute en fin de pétrissage. Pâte molle et grasse : on la refroidit souvent (pointage au froid) pour la façonner facilement.", "anim": ""}, {"t": "Pâte levée feuilletée : le croissant", "md": "La pâte à croissant est une **détrempe levée** (farine, eau ou lait, sucre, sel, levure) dans laquelle on enferme un **beurre de tourage**, comme pour le feuilletage.\n\n- Tourage classique : 1 tour double + 1 tour simple, ou 3 tours simples, selon la recette.\n- Repos au froid entre les tours : la levure est freinée et le beurre reste ferme.\n- Façonnage : triangles roulés (croissant), rectangles avec 2 barres de chocolat (pain au chocolat).\n- **Apprêt** à température modérée (environ 25 à 28 °C selon la recette) : plus chaud, le beurre fond et les feuillets disparaissent.\n- Dorure délicate, cuisson à four chaud.\n\nViennoiseries : croissant, pain au chocolat, pain aux raisins, brioche, chausson (feuilletée non levée).", "anim": ""}, {"t": "Défauts : causes et remèdes", "md": "Défaut | Causes probables | Remède\nPièces peu développées, denses | Apprêt trop court, levure tuée (liquide trop chaud), pâte trop froide | Respecter l'apprêt, contrôler la température des liquides\nPièces qui retombent, goût d'alcool | Apprêt trop long | Surveiller l'apprêt, enfourner à temps\nCroissants gras, sans feuillets | Beurre fondu à l'apprêt ou au tourage | Apprêt modéré, repos au froid entre les tours\nMie serrée | Pétrissage insuffisant | Pétrir jusqu'au test de la fenêtre\nCroûte pâle | Four pas assez chaud, dorure oubliée | Préchauffer, dorer", "anim": ""}, {"t": "Hygiène et allergènes", "md": "Pâtes crues filmées au froid ou congelées (crues ou précuites selon le plan de l'entreprise). La dorure à l'œuf se prépare en petite quantité et se garde au froid.\n\nAllergènes : gluten, lait, œufs (brioche, dorure).", "anim": ""}]}, "video": ""}, {"id": "PR-BISCUITS", "titre": "Biscuits et gâteaux de voyage", "court": "Biscuits", "poste": "Batteur", "domaine": "Procédés et techniques", "bloc": "BC01 / BC02", "prerequis": "TC-HS", "badge": "Roi du ruban", "competences": [{"id": "BI-1", "libelle": "Distinguer les familles de biscuits", "pratique": false}, {"id": "BI-2", "libelle": "Expliquer le foisonnement et la levée", "pratique": false}, {"id": "BI-3", "libelle": "Ordonner la fabrication d'une génoise", "pratique": false}, {"id": "BI-4", "libelle": "Reconnaître les gâteaux de voyage", "pratique": false}, {"id": "BI-5", "libelle": "Diagnostiquer un défaut de biscuit", "pratique": false}, {"id": "BI-6", "libelle": "Réaliser une génoise régulière", "pratique": true}], "fiche": {"duree": "8 min", "essentiel": ["Les biscuits lèvent surtout grâce à l'air incorporé : c'est le foisonnement.", "Génoise : œufs + sucre chauffés puis montés au ruban, farine incorporée délicatement.", "Biscuit cuillère : jaunes et blancs montés séparément.", "Gâteaux de voyage : se conservent plusieurs jours à température ambiante (cake, financier, madeleine).", "Incorporer à la maryse, sans faire retomber la masse."], "sections": [{"t": "Les familles de biscuits", "md": "Biscuit | Méthode | Utilisations\nGénoise | Œufs entiers + sucre montés au bain-marie, puis farine (et beurre fondu) | Fraisier, bûche, entremets\nBiscuit à la cuillère | Jaunes + sucre blanchis ; blancs montés avec sucre ; farine | Charlotte, fonds\nBiscuit Joconde | Œufs, sucre glace, poudre d'amande montés + blancs meringués + farine + beurre | Opéra, entremets en plaque\nDacquoise | Blancs montés + poudre d'amande ou noisette + sucre glace | Fonds croustillants-moelleux\nBiscuit roulé | Biscuit souple cuit en plaque fine | Bûche, roulé à la confiture", "anim": ""}, {"t": "La génoise pas à pas", "md": "1. Fouetter les œufs et le sucre au bain-marie jusqu'à ce que le mélange soit tiède (vers 40 à 45 °C selon la recette).\n2. Retirer du bain-marie et fouetter jusqu'à complet refroidissement : le mélange blanchit, triple de volume et forme un **ruban** (il coule et se plie sur lui-même).\n3. Incorporer la farine tamisée à la maryse, délicatement, en soulevant la masse.\n4. Ajouter le beurre fondu tiède (si la recette en prévoit) en dernier.\n5. Verser dans un moule beurré-fariné ou un cercle sur papier, cuire aussitôt.\n6. Contrôler la cuisson : la lame ressort sèche, la génoise reprend sa forme sous le doigt.\n\nLe chauffage dissout le sucre et aide les œufs à mousser : la masse est plus stable.", "anim": ""}, {"t": "Foisonnement et levée", "md": "**Foisonner** = incorporer de l'air en fouettant. Les protéines des œufs forment de petites bulles. À la cuisson, l'air se dilate et la vapeur se forme : le biscuit lève, puis les protéines coagulent et fixent la forme.\n\nLa **levure chimique** (cakes, madeleines) libère du gaz carbonique à l'humidité et à la chaleur, sans fermentation.\n\n**Beurre noisette** (financier) : beurre cuit jusqu'à couleur noisette et odeur de noisette grillée.", "anim": ""}, {"t": "Les gâteaux de voyage", "md": "Ce sont des gâteaux qui se conservent plusieurs jours à température ambiante, emballés : on peut les « emporter en voyage ».\n\nGâteau | Particularité\nCake | Pâte au beurre et à la levure chimique, fruits confits ou citron\nQuatre-quarts | Œufs, sucre, farine, beurre à poids égal\nFinancier | Blancs d'œufs, poudre d'amande, sucre glace, farine, beurre noisette\nMadeleine | Pâte reposée au froid ; le choc thermique au four forme la bosse\nPain de Gênes | Pâte d'amande, œufs, peu de farine", "anim": ""}, {"t": "Défauts : causes et remèdes", "md": "Défaut | Causes probables | Remède\nGénoise plate, compacte | Appareil pas assez monté, farine mélangée trop fort, attente avant cuisson | Monter au ruban, incorporer délicatement, enfourner aussitôt\nGénoise qui retombe | Four ouvert trop tôt, pas assez cuite | Ne pas ouvrir, contrôler la cuisson\nGrumeaux de farine | Farine non tamisée, versée d'un coup | Tamiser, verser en pluie\nBiscuit sec | Cuisson trop longue, four trop chaud | Régler le four, surveiller\nMadeleines sans bosse | Pâte pas assez froide, four pas assez chaud | Reposer au froid, four chaud", "anim": ""}, {"t": "Hygiène et allergènes", "md": "Les biscuits cuits se filment et se congèlent bien. Les gâteaux de voyage se conservent emballés à température ambiante, au sec.\n\nAllergènes : gluten, œufs, lait, fruits à coque (Joconde, dacquoise, financier).", "anim": ""}]}, "video": ""}, {"id": "PR-MERINGUES", "titre": "Meringues et cuisson du sucre", "court": "Meringues", "poste": "Feu", "domaine": "Procédés et techniques", "bloc": "BC01 / BC02", "prerequis": "TC-HS", "badge": "Blanc de neige", "competences": [{"id": "ME-1", "libelle": "Distinguer les trois meringues", "pratique": false}, {"id": "ME-2", "libelle": "Repérer les stades de cuisson du sucre", "pratique": false}, {"id": "ME-3", "libelle": "Expliquer le montage des blancs", "pratique": false}, {"id": "ME-4", "libelle": "Diagnostiquer un défaut de meringue ou de macaron", "pratique": false}, {"id": "ME-5", "libelle": "Appliquer les règles d'hygiène des œufs crus", "pratique": false}, {"id": "ME-6", "libelle": "Réaliser une meringue italienne", "pratique": true}], "fiche": {"duree": "8 min", "essentiel": ["Française : blancs montés + sucre, cuite au four doux.", "Suisse : blancs + sucre chauffés au bain-marie, puis montés.", "Italienne : sucre cuit au boulé (118 à 121 °C) versé sur les blancs montés.", "Une trace de jaune ou de gras empêche les blancs de monter.", "Macaron : tant pour tant + meringue, macaronage jusqu'au ruban brillant."], "sections": [{"t": "Les trois meringues", "md": "Meringue | Méthode | Utilisations\nFrançaise | Blancs montés, sucre ajouté peu à peu ; cuisson longue au four doux | Meringues sèches, vacherin, coques\nSuisse | Blancs + sucre fouettés au bain-marie (tiède), puis montés jusqu'à refroidissement | Décors, champignons, meringue ferme\nItalienne | Sucre cuit à 118-121 °C versé en filet sur les blancs montés, fouetter jusqu'à refroidissement | Tarte au citron, chiboust, crème au beurre, mousses, macarons\n\nLa meringue italienne est la plus stable : le sucre cuit « fixe » la mousse de blancs.", "anim": ""}, {"t": "Monter des blancs", "md": "- Cuve et fouet propres et **dégraissés** : une trace de jaune ou de matière grasse empêche la mousse de se former.\n- Blancs à température ambiante : ils montent plus facilement.\n- Ajouter le sucre **peu à peu** : il stabilise et rend la meringue brillante.\n- Ne pas trop fouetter sans sucre : les blancs « grainent » (ils se séparent en grumeaux et rendent du liquide).\n\nLes protéines du blanc se déplient et entourent les bulles d'air : c'est ce qui forme la mousse.", "anim": ""}, {"t": "La cuisson du sucre", "md": "On cuit un sirop (sucre + eau) et on contrôle sa température au thermomètre. Valeurs repères, à adapter à la recette :\n\nStade | Température repère | Exemple d'utilisation\nNappé / filé | 103 à 110 °C | Sirops\nBoulé | 115 à 125 °C | Meringue italienne (118-121 °C), pâte à bombe, fondant\nPetit cassé | 135 à 140 °C | Pâtes de fruits, certains nougats\nGrand cassé | 145 à 150 °C | Sucre tiré, coulé\nCaramel | à partir de 155-160 °C | Caramel, nougatine, choux caramélisés\n\n**Sécurité :** le sucre cuit brûle gravement. Gants, attention, et un récipient d'eau froide à proximité.", "anim": ""}, {"t": "Le macaron", "md": "1. Tamiser ensemble poudre d'amande et sucre glace à poids égal : c'est le **tant pour tant**.\n2. Préparer une meringue (souvent italienne).\n3. **Macaronner :** mélanger tant pour tant, blancs crus et meringue à la corne, jusqu'à une pâte brillante qui coule en ruban et dont les traces disparaissent lentement.\n4. Dresser à la poche, taper la plaque pour lisser.\n5. Laisser **croûter** : une peau se forme en surface.\n6. Cuire : le macaron forme sa **collerette** (le « pied »).\n\nPas assez macaronné : coques bosselées. Trop : la pâte s'étale et les coques sont plates.", "anim": ""}, {"t": "Défauts : causes et remèdes", "md": "Défaut | Causes probables | Remède\nLes blancs ne montent pas | Trace de jaune, cuve grasse | Bien séparer, dégraisser la cuve\nBlancs grainés | Trop fouettés sans sucre | Ajouter le sucre plus tôt, arrêter à temps\nMeringue qui suinte (perles de sirop) | Sucre mal dissous, cuisson trop chaude | Ajouter le sucre peu à peu, four doux\nMeringue colorée | Four trop chaud | Baisser la température\nCoques de macaron craquelées | Pas de croûtage, four trop chaud | Laisser croûter, régler le four", "anim": ""}, {"t": "Hygiène et allergènes", "md": "Les blancs d'œufs crus sont sensibles : on utilise des œufs frais ou des **ovoproduits pasteurisés**, on travaille vite et au propre. Une meringue italienne ou suisse est chauffée ; une meringue française reste crue tant qu'elle n'est pas cuite.\n\nAllergènes : œufs ; fruits à coque pour les macarons.", "anim": ""}]}, "video": ""}, {"id": "PR-CHOCO", "titre": "Chocolat : tempérage et décors", "court": "Chocolat", "poste": "Marbre", "domaine": "Procédés et techniques", "bloc": "BC02", "prerequis": "TC-HS", "badge": "Main de velours", "competences": [{"id": "CO-1", "libelle": "Distinguer les chocolats et leur composition", "pratique": false}, {"id": "CO-2", "libelle": "Expliquer le tempérage", "pratique": false}, {"id": "CO-3", "libelle": "Citer les courbes de tempérage", "pratique": false}, {"id": "CO-4", "libelle": "Diagnostiquer un défaut de chocolat", "pratique": false}, {"id": "CO-5", "libelle": "Conserver le chocolat", "pratique": false}, {"id": "CO-6", "libelle": "Tempérer et réaliser un décor simple", "pratique": true}], "fiche": {"duree": "8 min", "essentiel": ["Couverture = chocolat riche en beurre de cacao, pour enrober et mouler.", "Tempérer = fondre, refroidir, remonter légèrement en température.", "Noir (repère) : 50-55 °C, puis 28-29 °C, puis 31-32 °C. Suis toujours la courbe du fabricant.", "Bien tempéré : brillant, cassant net, se démoule facilement.", "Une goutte d'eau fait masser le chocolat (il épaissit et devient pâteux)."], "sections": [{"t": "Les chocolats", "md": "Chocolat | Composition\nNoir | Pâte (masse) de cacao, beurre de cacao, sucre\nAu lait | Pâte de cacao, beurre de cacao, sucre, lait en poudre\nBlanc | Beurre de cacao, sucre, lait en poudre ; pas de pâte de cacao\n\nLe **chocolat de couverture** contient plus de beurre de cacao : il est plus fluide une fois fondu, idéal pour enrober, mouler et décorer. Le pourcentage affiché (ex. 70 %) = la part totale issue du cacao.", "anim": ""}, {"t": "Le tempérage", "anim": "temperage", "md": "Le beurre de cacao peut cristalliser de plusieurs façons. Une seule donne un chocolat **brillant, cassant et qui se rétracte** (il se démoule seul). Tempérer, c'est faire cristalliser le beurre de cacao dans cette forme stable.\n\nCourbes repères (valeurs indicatives, suis celle du fabricant) :\n\nChocolat | Fondre à | Refroidir à | Remonter à\nNoir | 50-55 °C | 28-29 °C | 31-32 °C\nAu lait | 45-50 °C | 27-28 °C | 29-30 °C\nBlanc | 45 °C | 26-27 °C | 28-29 °C\n\nMéthodes : **tablage** (refroidir une partie sur un marbre), **ensemencement** (ajouter des pastilles de chocolat déjà tempéré), bain-marie ou micro-ondes avec contrôle au thermomètre.\n\n**Test :** une pointe de couteau trempée doit durcir en quelques minutes, brillante et sans traces."}, {"t": "Ganache et décors", "md": "**Ganache :** émulsion de crème chaude et de chocolat (on verse la crème en plusieurs fois et on mélange du centre vers l'extérieur). Garnitures, glaçages, bonbons.\n\n**Décors simples :** cornet en papier pour écrire, copeaux, plaquettes étalées sur feuille guitare, feuilles de transfert, décors moulés.\n\nTravailler dans une pièce fraîche (vers 18-20 °C).", "anim": ""}, {"t": "Défauts : causes et remèdes", "md": "Défaut | Causes probables | Remède\nTraces grises, aspect terne (blanchiment gras) | Mauvais tempérage, variations de température | Respecter la courbe, stockage stable\nVoile blanc poudreux (blanchiment sucrier) | Humidité : le sucre cristallise en surface | Stocker au sec, éviter le frigo humide\nLe chocolat masse (épais, pâteux) | Contact avec de l'eau ou de la vapeur | Ustensiles bien secs ; un chocolat massé sert pour ganache\nNe se démoule pas | Chocolat mal tempéré | Retempérer\nChocolat qui brûle, grumeleux | Fondu trop chaud ou trop vite | Fondre doucement, en remuant", "anim": ""}, {"t": "Conservation et allergènes", "md": "Conserver le chocolat entre 15 et 18 °C, au sec, à l'abri de la lumière et des odeurs (il les absorbe), emballé.\n\nAllergènes : lait (chocolat au lait et blanc, souvent traces dans le noir), soja (lécithine) selon l'étiquette, fruits à coque pour les pralinés. Toujours lire l'étiquette du fournisseur.", "anim": ""}]}, "video": ""}, {"id": "PR-ENTREMETS", "titre": "Entremets et petits gâteaux", "court": "Entremets", "poste": "Montage", "domaine": "Procédés et techniques", "bloc": "BC02", "prerequis": "PR-CREMES", "badge": "Architecte des entremets", "competences": [{"id": "EN-1", "libelle": "Décrire la structure d'un entremets", "pratique": false}, {"id": "EN-2", "libelle": "Ordonner un montage en cercle", "pratique": false}, {"id": "EN-3", "libelle": "Utiliser la gélatine et réaliser une mousse", "pratique": false}, {"id": "EN-4", "libelle": "Choisir un glaçage et un décor", "pratique": false}, {"id": "EN-5", "libelle": "Calculer des portions et des grammages", "pratique": false}, {"id": "EN-6", "libelle": "Valoriser et conserver les produits", "pratique": false}, {"id": "EN-7", "libelle": "Monter, glacer et décorer un entremets", "pratique": true}], "fiche": {"duree": "10 min", "essentiel": ["Un entremets = un fond + une ou plusieurs garnitures + un glaçage + un décor.", "Montage en cercle chemisé de rhodoïd, prise au froid, puis glaçage et décor.", "Gélatine : réhydrater dans l'eau froide, essorer, dissoudre dans une base chaude.", "Mousse = base + gélatine + crème fouettée mousseuse, incorporée à la bonne température.", "Valoriser : décor net, propreté, étiquette avec les allergènes."], "sections": [{"t": "La structure d'un entremets", "md": "Couche | Rôle | Exemples\nFond | Support, texture | Génoise, biscuit Joconde, dacquoise, pâte sablée, croustillant praliné\nImbibage | Moelleux et parfum | Sirop parfumé\nGarniture | Goût principal | Mousse, crème, bavaroise\nInsert | Surprise, contraste | Crémeux, compotée, gelée\nGlaçage | Finition, brillance | Miroir, nappage, ganache\nDécor | Valorisation | Fruits, chocolat, macarons\n\nLes **petits gâteaux** suivent les mêmes principes, en portions individuelles (éclairs, tartelettes, mini-entremets).", "anim": ""}, {"t": "Montage en cercle", "md": "1. Chemiser le cercle avec une bande de rhodoïd, le poser sur une plaque recouverte de papier.\n2. Détailler le fond au diamètre, le placer dans le cercle, l'imbiber de sirop.\n3. Réaliser la mousse au dernier moment.\n4. Garnir à mi-hauteur, poser l'insert, compléter de mousse.\n5. Lisser à la spatule au ras du cercle.\n6. Faire prendre au froid (ou surgeler pour un glaçage miroir).\n7. Décercler, retirer le rhodoïd.\n8. Glacer, décorer, étiqueter.\n\n**Montage à l'envers :** on garnit le moule de mousse, puis l'insert, puis le fond posé en dernier ; on démoule et on retourne. Les surfaces sont plus nettes.", "anim": ""}, {"t": "Gélatine et mousses", "md": "**Gélatine en feuilles** (environ 2 g la feuille) :\n1. Réhydrater dans de l'eau froide quelques minutes.\n2. Essorer.\n3. Dissoudre dans une partie chaude de la préparation (sans la faire bouillir longtemps).\n\nLa gélatine gélifie en refroidissant. Trop : texture caoutchouteuse. Pas assez : l'entremets s'affaisse.\n\n**Mousse :** base (purée de fruits, crème anglaise, pâte à bombe, chocolat) + gélatine + **crème fouettée mousseuse** (pas trop ferme). On incorpore la crème quand la base est tiède à froide : trop chaude, la crème fond ; trop froide, la base a déjà pris et fait des grumeaux.", "anim": ""}, {"t": "Glaçages et décors", "md": "Glaçage | Utilisation | Repère\nFondant | Éclairs, religieuses, petits gâteaux | Tiédi (vers 35-37 °C), détendu au sirop\nGlaçage miroir | Entremets surgelés | Versé tiède sur l'entremets bien froid, d'un seul geste\nNappage | Tartes aux fruits | Fait briller et protège les fruits du dessèchement\nGanache | Entremets chocolat | Coulée ou montée\n\n**Valoriser :** décor sobre et propre, bords nets, couleurs en harmonie avec le goût, carton ou semelle propre, étiquette (nom, date, allergènes).", "anim": ""}, {"t": "Défauts : causes et remèdes", "md": "Défaut | Causes probables | Remède\nMousse qui s'affaisse | Pas assez de gélatine, crème trop fouettée ou trop chaude | Peser la gélatine, crème mousseuse, bonne température\nMousse granuleuse | Base trop froide à l'incorporation | Incorporer sur une base tiède\nGlaçage trop épais ou terne | Glaçage trop froid | Le tiédir à la bonne température\nGlaçage qui coule et ne tient pas | Entremets pas assez froid, glaçage trop chaud | Bien surgeler, contrôler la température\nBords irréguliers | Rhodoïd absent, lissage insuffisant | Chemiser, lisser au ras du cercle", "anim": ""}, {"t": "Conservation et hygiène", "md": "Entremets et petits gâteaux à la crème : entre 0 et +3 °C. Un entremets surgelé se décongèle **au froid positif**, jamais à température ambiante. On étiquette avec la date de fabrication (et de décongélation). Durée de vie : selon le plan de maîtrise sanitaire.", "anim": ""}]}, "video": ""}, {"id": "GE-COUTS", "titre": "Calculs et coût des produits", "court": "Coûts", "poste": "Bureau", "domaine": "Calculs professionnels (tronc commun)", "bloc": "BC02", "prerequis": "", "badge": "Gardien du budget", "competences": [{"id": "CT-1", "libelle": "Calculer un coût matière", "pratique": false}, {"id": "CT-2", "libelle": "Calculer un coût par portion", "pratique": false}, {"id": "CT-3", "libelle": "Calculer un prix de vente HT et TTC", "pratique": false}, {"id": "CT-4", "libelle": "Tenir compte des pertes et du rendement", "pratique": false}, {"id": "CT-5", "libelle": "Proposer des actions contre le gaspillage", "pratique": false}], "fiche": {"duree": "8 min", "essentiel": ["Coût matière = somme des (quantité × prix) de chaque ingrédient.", "Coût par portion = coût matière total ÷ nombre de portions.", "Prix de vente HT = coût matière × coefficient. Prix TTC = prix HT × (1 + taux de TVA).", "Poids net = poids brut × rendement (ou − pertes).", "Moins de gaspillage = coût plus bas et labo plus responsable."], "sections": [{"t": "Le coût matière", "md": "Pour chaque ingrédient : **quantité utilisée × prix unitaire**. Attention aux unités : on convertit les grammes en kilos si le prix est au kilo.\n\nExemple pour une pâte sucrée :\n\nIngrédient | Quantité | Prix | Coût\nFarine | 0,250 kg | 0,90 €/kg | 0,225 €\nBeurre | 0,150 kg | 9,00 €/kg | 1,35 €\nSucre glace | 0,100 kg | 2,00 €/kg | 0,20 €\nŒuf | 1 pièce | 0,25 €/pièce | 0,25 €\nTotal | | | 2,025 € ≈ 2,03 €", "anim": ""}, {"t": "Portions, prix de vente, TVA", "md": "**Coût par portion** = coût total ÷ nombre de portions.\n\n**Prix de vente HT** = coût matière × **coefficient multiplicateur** (fixé par l'entreprise ; il couvre la main-d'œuvre, l'énergie, les frais et la marge).\n\n**Prix TTC** = prix HT × (1 + taux de TVA). Avec une TVA de 5,5 % : prix HT × 1,055. Avec 10 % : × 1,10. Le taux dépend du produit et du mode de vente : il est donné par l'entreprise.\n\n**Ratio matière** = coût matière ÷ prix de vente HT × 100. Il dit quelle part du prix sert à payer les ingrédients.", "anim": ""}, {"t": "Pertes et rendement", "md": "Certaines matières perdent du poids : épluchage, équeutage, noyaux, cuisson.\n\n- **Poids net = poids brut × rendement.** Ex. : 1 kg de fraises à 90 % de rendement donne 900 g de fraises équeutées.\n- Pour obtenir un poids net : **poids brut = poids net ÷ rendement.** Ex. : il faut 900 g nets de pommes à 75 % de rendement : 900 ÷ 0,75 = 1 200 g bruts.\n- Le coût d'un produit net = prix brut ÷ rendement.", "anim": ""}, {"t": "Lutter contre le gaspillage", "md": "Le référentiel demande de respecter les préconisations liées au développement durable, notamment la lutte contre le gaspillage.\n\n- Peser juste, suivre la fiche technique.\n- Appliquer le PEPS, surveiller les dates.\n- Réutiliser les chutes quand c'est possible et sûr (chutes de feuilletage pour palmiers ou allumettes, biscuits pour fonds).\n- Ajuster les quantités aux ventes.\n- Trier l
